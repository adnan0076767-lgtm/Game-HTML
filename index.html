<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Battle Arena V5 PRO MAX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050609;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#050609;
}

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(1100px,94%);
  display:flex;
  justify-content:space-between;
  gap:15px;
  pointer-events:none;
  z-index:5;
}

.panel{
  width:42%;
  min-width:180px;
}

.name{
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
  text-shadow:0 2px 5px #000;
}

.bar{
  height:18px;
  background:#161922;
  border:2px solid rgba(255,255,255,.18);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 4px 15px #000;
}

.fill{
  height:100%;
  width:100%;
  transition:width .15s;
}

.hp{
  background:linear-gradient(90deg,#21d878,#a8ff50);
}

.enemyhp{
  background:linear-gradient(90deg,#ff3333,#ff8a32);
}

.energy{
  height:7px;
  margin-top:5px;
  background:#161922;
  border-radius:20px;
  overflow:hidden;
}

.energyFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#20a9ff,#8b6cff);
}

.stats{
  display:flex;
  gap:10px;
  margin-top:7px;
  font-size:11px;
  opacity:.9;
}

#enemyPanel{
  text-align:right;
}

#enemyPanel .bar{
  direction:rtl;
}

#combo{
  position:fixed;
  top:115px;
  left:50%;
  transform:translateX(-50%) scale(.8);
  opacity:0;
  transition:.2s;
  text-align:center;
  z-index:6;
  pointer-events:none;
}

#combo.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

.comboNumber{
  font-size:42px;
  font-weight:900;
  line-height:1;
  text-shadow:0 5px 20px #000;
}

.comboText{
  font-size:14px;
  font-weight:bold;
  letter-spacing:3px;
}

#topButtons{
  position:fixed;
  right:14px;
  top:14px;
  z-index:10;
  display:flex;
  gap:7px;
}

.topBtn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(10,12,18,.7);
  color:white;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

#centerMessage{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  text-align:center;
  width:min(500px,90%);
  display:none;
  padding:30px;
  background:rgba(5,7,12,.88);
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  box-shadow:0 20px 80px #000;
  backdrop-filter:blur(10px);
}

#centerMessage h1{
  font-size:42px;
  margin-bottom:10px;
}

#centerMessage p{
  opacity:.75;
  margin-bottom:20px;
}

.mainBtn{
  border:0;
  padding:13px 25px;
  border-radius:12px;
  color:white;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(135deg,#ff512f,#dd2476);
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:15px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlSide{
  display:flex;
  gap:8px;
  pointer-events:auto;
}

.btn{
  width:62px;
  height:62px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  color:white;
  background:rgba(15,18,27,.82);
  box-shadow:0 8px 20px #0008;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  user-select:none;
}

.btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.18);
}

.attack{
  width:75px;
  height:75px;
  background:rgba(200,40,40,.8);
}

.skill{
  background:rgba(90,50,190,.8);
}

#intro{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,rgba(100,30,80,.3),transparent 40%),
    #030407;
}

.introBox{
  width:min(600px,90%);
  text-align:center;
}

.logo{
  font-size:clamp(38px,8vw,76px);
  font-weight:900;
  letter-spacing:-3px;
  text-shadow:0 0 40px rgba(255,70,80,.5);
}

.logo span{
  display:block;
  color:#ff4d55;
}

.introSub{
  margin:15px 0 30px;
  color:#aeb4c4;
  letter-spacing:3px;
  font-size:12px;
}

#startBtn{
  padding:16px 35px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#ff4d4d,#8b2cff);
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 10px 40px #000;
}

#pauseLayer{
  position:fixed;
  inset:0;
  z-index:25;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(5px);
}

.pauseBox{
  text-align:center;
}

.pauseBox h2{
  font-size:45px;
  margin-bottom:20px;
}

@media(max-width:650px){
  #hud{
    top:8px;
    width:96%;
    gap:7px;
  }

  .panel{
    min-width:0;
    width:48%;
  }

  .name{
    font-size:10px;
  }

  .bar{
    height:14px;
  }

  .stats{
    font-size:9px;
  }

  #combo{
    top:95px;
  }

  .comboNumber{
    font-size:32px;
  }

  .btn{
    width:52px;
    height:52px;
    font-size:9px;
  }

  .attack{
    width:66px;
    height:66px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="intro">
  <div class="introBox">
    <div class="logo">BATTLE<span>ARENA</span></div>
    <div class="introSub">V5 PRO MAX • REAL-TIME 3D STYLE COMBAT</div>
    <button id="startBtn">MULAI PERTARUNGAN</button>
  </div>
</div>

<div id="hud">

  <div class="panel">
    <div class="name">⚔️ WARRIOR</div>
    <div class="bar">
      <div id="playerHP" class="fill hp"></div>
    </div>
    <div class="energy">
      <div id="playerEnergy" class="energyFill"></div>
    </div>
    <div class="stats">
      <span>LV <b id="level">1</b></span>
      <span>XP <b id="xp">0</b></span>
      <span>COINS <b id="coins">0</b></span>
    </div>
  </div>

  <div class="panel" id="enemyPanel">
    <div class="name">☠ DEMON LORD</div>
    <div class="bar">
      <div id="enemyHP" class="fill enemyhp"></div>
    </div>
    <div class="energy">
      <div id="enemyEnergy" class="energyFill"></div>
    </div>
    <div class="stats">
      <span>BOSS</span>
      <span>LV <b id="enemyLevel">1</b></span>
    </div>
  </div>

</div>

<div id="combo">
  <div class="comboNumber" id="comboNumber">0</div>
  <div class="comboText" id="comboText">COMBO</div>
</div>

<div id="topButtons">
  <button class="topBtn" id="pauseBtn">Ⅱ</button>
  <button class="topBtn" id="soundBtn">🔊</button>
</div>

<div id="centerMessage">
  <h1 id="resultTitle">VICTORY</h1>
  <p id="resultText"></p>
  <button class="mainBtn" id="restartBtn">PERTARUNGAN LAGI</button>
</div>

<div id="pauseLayer">
  <div class="pauseBox">
    <h2>PAUSED</h2>
    <button class="mainBtn" id="resumeBtn">LANJUT</button>
  </div>
</div>

<div id="controls">

  <div class="controlSide">
    <button class="btn" id="leftBtn">◀<br>MOVE</button>
    <button class="btn" id="rightBtn">▶<br>MOVE</button>
    <button class="btn" id="blockBtn">🛡<br>BLOCK</button>
  </div>

  <div class="controlSide">
    <button class="btn" id="dashBtn">⚡<br>DASH</button>
    <button class="btn skill" id="skillBtn">✦<br>SKILL</button>
    <button class="btn attack" id="attackBtn">⚔<br>ATK</button>
  </div>

</div>

<script>
"use strict";

/* =========================================================
   BATTLE ARENA V5 PRO MAX
   Single-file HTML
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let DPR = Math.min(devicePixelRatio || 1,2);

function resize(){
  W=innerWidth;
  H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  canvas.width=W*DPR;
  canvas.height=H*DPR;
  canvas.style.width=W+"px";
  canvas.style.height=H+"px";

  ctx.setTransform(DPR,0,0,DPR,0,0);
}

addEventListener("resize",resize);
resize();

/* ---------------- SAVE ---------------- */

let save=JSON.parse(localStorage.getItem("battleArenaSaveV5")||"null") || {
  level:1,
  xp:0,
  coins:0
};

function saveGame(){
  localStorage.setItem(
    "battleArenaSaveV5",
    JSON.stringify(save)
  );
}

function xpNeeded(){
  return 100 + (save.level-1)*70;
}

function addXP(amount){
  save.xp+=amount;

  while(save.xp>=xpNeeded()){
    save.xp-=xpNeeded();
    save.level++;
  }

  updateHUD();
  saveGame();
}

/* ---------------- GAME ---------------- */

let running=false;
let paused=false;
let gameOver=false;
let sound=true;

let keys={};

addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="Space"){
    e.preventDefault();
    player.block=true;
  }

  if(e.code==="KeyJ") attack();
  if(e.code==="KeyK") heavy();
  if(e.code==="KeyL") skill();
  if(e.code==="ShiftLeft") dash();
});

addEventListener("keyup",e=>{
  keys[e.code]=false;

  if(e.code==="Space"){
    player.block=false;
  }
});

/* ---------------- ENTITIES ---------------- */

const player={
  x:0,
  z:0,
  hp:100,
  maxHP:100,
  energy:100,
  maxEnergy:100,
  speed:4,
  attackCooldown:0,
  dashCooldown:0,
  skillCooldown:0,
  block:false,
  attackAnim:0,
  hurt:0,
  facing:1
};

const enemy={
  x:4,
  z:0,
  hp:150,
  maxHP:150,
  energy:100,
  attackCooldown:1,
  skillCooldown:4,
  attackAnim:0,
  hurt:0,
  facing:-1,
  phase:1
};

/* ---------------- PARTICLES ---------------- */

let particles=[];
let texts=[];
let slashes=[];
let sparks=[];

function particle(x,y,z,color,size=4){
  particles.push({
    x,y,z,
    vx:(Math.random()-.5)*3,
    vy:Math.random()*2+1,
    vz:(Math.random()-.5)*3,
    life:.7+Math.random()*.6,
    max:1,
    size,
    color
  });
}

function damageText(x,y,text){
  texts.push({
    x,y,
    text,
    life:1,
    vy:-35
  });
}

function slash(x,y,flip=false,strong=false){
  slashes.push({
    x,y,
    flip,
    strong,
    life:.35,
    max:.35,
    rot:(Math.random()-.5)*.4
  });
}

/* ---------------- SOUND ---------------- */

let audioCtx=null;

function beep(freq,duration,type="sine"){
  if(!sound)return;

  try{
    if(!audioCtx){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    }

    const o=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    o.type=type;
    o.frequency.value=freq;
    g.gain.value=.045;

    o.connect(g);
    g.connect(audioCtx.destination);

    o.start();
    g.gain.exponentialRampToValueAtTime(
      .001,
      audioCtx.currentTime+duration
    );

    o.stop(audioCtx.currentTime+duration);
  }catch(e){}
}

/* ---------------- CAMERA ---------------- */

let cameraShake=0;

function shake(amount){
  cameraShake=Math.max(cameraShake,amount);
}

/* ---------------- COMBAT ---------------- */

let combo=0;
let comboTimer=0;

function distance(){
  return Math.abs(player.x-enemy.x);
}

function playerDamage(amount){
  if(gameOver)return;

  if(player.block){
    amount*=.25;
    particle(player.x,1.6,0,"#7db5ff",5);
    beep(180,.06,"square");
  }else{
    player.hp-=amount;
    player.hurt=.2;
    shake(5);
    damageText(W/2,210,"-"+Math.round(amount));
    beep(90,.12,"sawtooth");
  }

  if(player.hp<=0){
    player.hp=0;
    endGame(false);
  }

  updateHUD();
}

function enemyDamage(amount){
  if(gameOver)return;

  if(Math.random()<.12){
    amount*=.7;
  }

  enemy.hp-=amount;
  enemy.hurt=.18;

  combo++;
  comboTimer=2;

  damageText(
    W/2 + (Math.random()-.5)*100,
    230,
    Math.round(amount)
  );

  for(let i=0;i<8;i++){
    particle(
      enemy.x,
      1.5,
      0,
      Math.random()<.5?"#ffcc44":"#ff6644",
      3+Math.random()*3
    );
  }

  shake(amount>20?8:4);
  beep(amount>20?120:220,.07,"square");

  slash(
    W/2,
    H*.47,
    enemy.x<player.x,
    amount>20
  );

  updateCombo();

  if(enemy.hp<=0){
    enemy.hp=0;
    endGame(true);
  }

  updateHUD();
}

function attack(){
  if(!running||paused||gameOver)return;
  if(player.attackCooldown>0)return;

  player.attackCooldown=.35;
  player.attackAnim=.35;

  beep(260,.05);

  if(distance()<2.4){
    enemyDamage(8 + save.level*1.2);
  }else{
    slash(W/2,H*.48,player.facing<0);
  }
}

function heavy(){
  if(!running||paused||gameOver)return;
  if(player.attackCooldown>0)return;
  if(player.energy<18)return;

  player.energy-=18;
  player.attackCooldown=.75;
  player.attackAnim=.75;

  beep(150,.1,"sawtooth");

  if(distance()<2.8){
    enemyDamage(17 + save.level*2);
  }

  slash(W/2,H*.47,player.facing<0,true);
  shake(5);
}

function skill(){
  if(!running||paused||gameOver)return;
  if(player.skillCooldown>0)return;
  if(player.energy<35)return;

  player.energy-=35;
  player.skillCooldown=4;
  player.attackAnim=.9;

  beep(70,.2,"sawtooth");

  for(let i=0;i<35;i++){
    particle(
      player.x,
      1+Math.random()*2,
      (Math.random()-.5)*2,
      Math.random()<.5?"#a45cff":"#4ccfff",
      3+Math.random()*5
    );
  }

  if(distance()<3.7){
    enemyDamage(32 + save.level*3);
  }

  shake(12);
}

function dash(){
  if(!running||paused||gameOver)return;
  if(player.dashCooldown>0)return;

  player.dashCooldown=.8;
  player.x+=player.facing*2.2;

  player.x=Math.max(-7,Math.min(7,player.x));

  beep(330,.04);

  for(let i=0;i<12;i++){
    particle(
      player.x,
      .5+Math.random()*1.5,
      (Math.random()-.5),
      "#72d7ff",
      2+Math.random()*3
    );
  }
}

/* ---------------- ENEMY AI ---------------- */

let aiTimer=0;

function enemyAI(dt){

  if(gameOver)return;

  const d=distance();

  enemy.facing=player.x<enemy.x?-1:1;

  if(d>2.1){
    enemy.x+=enemy.facing*1.4*dt;
  }

  if(d<2.8){
    enemy.x-=enemy.facing*.25*dt;
  }

  enemy.x=Math.max(-7,Math.min(7,enemy.x));

  enemy.attackCooldown-=dt;
  enemy.skillCooldown-=dt;

  if(d<2.6 && enemy.attackCooldown<=0){

    const roll=Math.random();

    if(roll<.18 && enemy.skillCooldown<=0){
      enemy.skillCooldown=5;
      enemy.attackAnim=.8;

      for(let i=0;i<25;i++){
        particle(
          enemy.x,
          1+Math.random()*2,
          (Math.random()-.5)*1.5,
          "#ff3030",
          3+Math.random()*4
        );
      }

      playerDamage(22+save.level*2);
      slash(W/2,H*.47,true,true);

    }else{
      enemy.attackCooldown=.8+Math.random()*.6;
      enemy.attackAnim=.45;

      playerDamage(
        (enemy.phase>=2?14:10)+Math.random()*5
      );

      slash(W/2,H*.47,true);
    }
  }

  if(enemy.hp<enemy.maxHP*.45 && enemy.phase===1){
    enemy.phase=2;
    enemy.maxHP+=50;
    enemy.hp+=50;
    enemy.attackCooldown=.3;

    for(let i=0;i<45;i++){
      particle(
        enemy.x,
        1+Math.random()*2.5,
        (Math.random()-.5)*2,
        "#ff3333",
        4+Math.random()*5
      );
    }

    shake(15);
  }
}

/* ---------------- UPDATE ---------------- */

function update(dt){

  if(!running||paused||gameOver)return;

  player.attackCooldown=Math.max(
    0,
    player.attackCooldown-dt
  );

  player.dashCooldown=Math.max(
    0,
    player.dashCooldown-dt
  );

  player.skillCooldown=Math.max(
    0,
    player.skillCooldown-dt
  );

  player.hurt=Math.max(0,player.hurt-dt);
  enemy.hurt=Math.max(0,enemy.hurt-dt);

  if(!player.block){

    let move=0;

    if(keys.ArrowLeft||keys.KeyA)move--;
    if(keys.ArrowRight||keys.KeyD)move++;

    if(move!==0){
      player.x+=move*player.speed*dt;
      player.facing=move;
    }

    player.x=Math.max(-7,Math.min(7,player.x));
  }

  player.energy=Math.min(
    player.maxEnergy,
    player.energy+12*dt
  );

  enemy.energy=Math.min(
    100,
    enemy.energy+8*dt
  );

  enemyAI(dt);

  comboTimer-=dt;

  if(comboTimer<=0){
    combo=0;
    updateCombo();
  }

  particles.forEach(p=>{
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.z+=p.vz*dt;
    p.vy-=3*dt;
    p.life-=dt;
  });

  particles=particles.filter(p=>p.life>0);

  texts.forEach(t=>{
    t.y+=t.vy*dt;
    t.life-=dt;
  });

  texts=texts.filter(t=>t.life>0);

  slashes.forEach(s=>s.life-=dt);
  slashes=slashes.filter(s=>s.life>0);

  cameraShake=Math.max(0,cameraShake-dt*18);

  updateHUD();
}

/* ---------------- HUD ---------------- */

function updateHUD(){

  document.getElementById("playerHP").style.width=
    Math.max(0,player.hp/player.maxHP*100)+"%";

  document.getElementById("enemyHP").style.width=
    Math.max(0,enemy.hp/enemy.maxHP*100)+"%";

  document.getElementById("playerEnergy").style.width=
    Math.max(0,player.energy/player.maxEnergy*100)+"%";

  document.getElementById("enemyEnergy").style.width=
    Math.max(0,enemy.energy/100*100)+"%";

  document.getElementById("level").textContent=save.level;
  document.getElementById("xp").textContent=
    save.xp+"/"+xpNeeded();

  document.getElementById("coins").textContent=save.coins;
  document.getElementById("enemyLevel").textContent=
    save.level+1;
}

function updateCombo(){

  const box=document.getElementById("combo");
  const num=document.getElementById("comboNumber");
  const txt=document.getElementById("comboText");

  if(combo<=0){
    box.classList.remove("show");
    return;
  }

  box.classList.add("show");
  num.textContent=combo;

  let rank="COMBO";

  if(combo>=3)rank="GOOD";
  if(combo>=6)rank="GREAT";
  if(combo>=10)rank="EPIC";
  if(combo>=15)rank="LEGEND";

  txt.textContent=rank;
}

/* ---------------- DRAW HELPERS ---------------- */

function project(x,y,z=0){

  const horizon=H*.47;

  const scale=
    1/(1+z*.07);

  return {
    x:W/2 + x*55*scale,
    y:horizon - y*70*scale + z*20,
    scale
  };
}

function shadow(x,y,size){

  ctx.save();

  ctx.globalAlpha=.35;
  ctx.fillStyle="#000";

  ctx.beginPath();
  ctx.ellipse(x,y,size,size*.25,0,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* ---------------- ARENA ---------------- */

function drawBackground(time){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#070915");
  g.addColorStop(.45,"#121327");
  g.addColorStop(1,"#030407");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* moon */

  const mx=W*.5;
  const my=H*.2;

  const moon=ctx.createRadialGradient(
    mx,my,2,
    mx,my,100
  );

  moon.addColorStop(0,"rgba(255,255,230,.8)");
  moon.addColorStop(.2,"rgba(180,190,255,.25)");
  moon.addColorStop(1,"transparent");

  ctx.fillStyle=moon;
  ctx.beginPath();
  ctx.arc(mx,my,100,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="rgba(255,255,240,.7)";
  ctx.beginPath();
  ctx.arc(mx,my,32,0,Math.PI*2);
  ctx.fill();

  /* stars */

  for(let i=0;i<50;i++){
    const x=(i*173)%W;
    const y=(i*67)%(H*.4);

    ctx.globalAlpha=.3+Math.sin(time*.001+i)*.2;

    ctx.fillStyle="#fff";
    ctx.fillRect(x,y,1.5,1.5);
  }

  ctx.globalAlpha=1;

  /* ruins */

  for(let i=0;i<11;i++){

    const x=i*W/10;

    const h=40+(i%4)*25;

    ctx.fillStyle="#0b0d17";

    ctx.fillRect(
      x,
      H*.43-h,
      25,
      h
    );

    ctx.fillRect(
      x-8,
      H*.43-h-8,
      41,
      8
    );
  }

  /* fog */

  const fog=ctx.createLinearGradient(
    0,H*.35,
    0,H*.75
  );

  fog.addColorStop(0,"transparent");
  fog.addColorStop(.6,"rgba(100,90,130,.08)");
  fog.addColorStop(1,"rgba(10,10,20,.5)");

  ctx.fillStyle=fog;
  ctx.fillRect(0,H*.3,W,H*.5);
}

/* ---------------- FLOOR ---------------- */

function drawArena(){

  const horizon=H*.47;

  ctx.fillStyle="#080a0e";

  ctx.beginPath();
  ctx.moveTo(0,horizon);
  ctx.lineTo(W,horizon);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();

  /* perspective lines */

  ctx.strokeStyle="rgba(130,120,150,.12)";
  ctx.lineWidth=1;

  for(let i=-12;i<=12;i++){

    ctx.beginPath();

    ctx.moveTo(W/2+i*10,horizon);

    ctx.lineTo(
      W/2+i*120,
      H
    );

    ctx.stroke();
  }

  for(let i=0;i<9;i++){

    const t=i/8;
    const y=horizon+
      Math.pow(t,1.7)*(H-horizon);

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* arena circle */

  ctx.strokeStyle="rgba(200,80,80,.25)";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.ellipse(
    W/2,
    H*.69,
    W*.32,
    H*.12,
    0,
    0,
    Math.PI*2
  );
  ctx.stroke();
}

/* ---------------- FIGHTERS ---------------- */

function drawWarrior(e,time){

  const p=project(e.x,0,0);

  const x=p.x;
  const y=p.y;
  const s=1.05;

  shadow(x,y+5,42*s);

  ctx.save();
  ctx.translate(x,y);

  if(e.hurt>0){
    ctx.translate(
      (Math.random()-.5)*6,
      (Math.random()-.5)*4
    );
  }

  /* aura */

  if(player.skillCooldown<=0){

    const aura=ctx.createRadialGradient(
      0,-70,5,
      0,-70,65
    );

    aura.addColorStop(0,"rgba(80,160,255,.15)");
    aura.addColorStop(1,"transparent");

    ctx.fillStyle=aura;

    ctx.beginPath();
    ctx.arc(0,-70,70,0,Math.PI*2);
    ctx.fill();
  }

  /* legs */

  ctx.fillStyle="#1b2331";

  ctx.fillRect(-20,-35,15,38);
  ctx.fillRect(5,-35,15,38);

  /* boots */

  ctx.fillStyle="#090c13";

  ctx.fillRect(-24,-5,23,9);
  ctx.fillRect(4,-5,23,9);

  /* body armor */

  const body=ctx.createLinearGradient(
    -25,-110,
    25,-40
  );

  body.addColorStop(0,"#4d6c99");
  body.addColorStop(.5,"#24344e");
  body.addColorStop(1,"#111a29");

  ctx.fillStyle=body;

  ctx.beginPath();
  ctx.moveTo(-30,-105);
  ctx.lineTo(30,-105);
  ctx.lineTo(24,-35);
  ctx.lineTo(-24,-35);
  ctx.closePath();
  ctx.fill();

  /* chest plate */

  ctx.strokeStyle="rgba(130,200,255,.6)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.moveTo(0,-100);
  ctx.lineTo(0,-45);
  ctx.stroke();

  /* shoulder */

  ctx.fillStyle="#314967";

  ctx.beginPath();
  ctx.arc(-30,-93,15,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(30,-93,15,0,Math.PI*2);
  ctx.fill();

  /* arms */

  ctx.strokeStyle="#273c5c";
  ctx.lineWidth=13;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-30,-90);
  ctx.lineTo(-45,-50);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(30,-90);
  ctx.lineTo(48,-50);
  ctx.stroke();

  /* head */

  ctx.fillStyle="#d3a98d";

  ctx.beginPath();
  ctx.arc(0,-130,22,0,Math.PI*2);
  ctx.fill();

  /* hair */

  ctx.fillStyle="#15171e";

  ctx.beginPath();
  ctx.arc(0,-139,22,Math.PI,Math.PI*2);
  ctx.fill();

  /* eye */

  ctx.fillStyle="#74d7ff";

  ctx.fillRect(
    e.facing>0?5:-10,
    -132,
    6,
    3
  );

  /* sword */

  const swing=
    e.attackAnim>0?
    Math.sin(e.attackAnim*20)*.6:
    0;

  ctx.save();
  ctx.translate(47,-55);
  ctx.rotate(
    e.facing>0?
    -0.9+swing:
    .9-swing
  );

  ctx.fillStyle="#16191e";
  ctx.fillRect(-4,0,8,28);

  const blade=ctx.createLinearGradient(
    0,-80,
    0,0
  );

  blade.addColorStop(0,"#ffffff");
  blade.addColorStop(.4,"#9bcaff");
  blade.addColorStop(1,"#45566b");

  ctx.fillStyle=blade;

  ctx.beginPath();
  ctx.moveTo(-5,0);
  ctx.lineTo(5,0);
  ctx.lineTo(3,-78);
  ctx.lineTo(0,-91);
  ctx.lineTo(-3,-78);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  ctx.restore();
}

function drawDemon(e,time){

  const p=project(e.x,0,0);

  const x=p.x;
  const y=p.y;

  shadow(x,y+8,52);

  ctx.save();
  ctx.translate(x,y);

  if(e.hurt>0){
    ctx.translate(
      (Math.random()-.5)*8,
      (Math.random()-.5)*5
    );
  }

  /* aura */

  const aura=ctx.createRadialGradient(
    0,-85,10,
    0,-85,90
  );

  aura.addColorStop(
    0,
    e.phase>=2?
    "rgba(255,30,30,.3)":
    "rgba(150,30,70,.2)"
  );

  aura.addColorStop(1,"transparent");

  ctx.fillStyle=aura;

  ctx.beginPath();
  ctx.arc(0,-85,90,0,Math.PI*2);
  ctx.fill();

  /* wings */

  ctx.fillStyle="#180d18";

  ctx.beginPath();
  ctx.moveTo(-25,-100);
  ctx.lineTo(-90,-155);
  ctx.lineTo(-70,-65);
  ctx.lineTo(-35,-45);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(25,-100);
  ctx.lineTo(90,-155);
  ctx.lineTo(70,-65);
  ctx.lineTo(35,-45);
  ctx.closePath();
  ctx.fill();

  /* legs */

  ctx.fillStyle="#32151d";

  ctx.fillRect(-23,-45,18,42);
  ctx.fillRect(5,-45,18,42);

  /* body */

  const body=ctx.createLinearGradient(
    -30,-115,
    30,-35
  );

  body.addColorStop(0,"#661c2c");
  body.addColorStop(.5,"#35131e");
  body.addColorStop(1,"#14090f");

  ctx.fillStyle=body;

  ctx.beginPath();
  ctx.moveTo(-33,-108);
  ctx.lineTo(33,-108);
  ctx.lineTo(26,-38);
  ctx.lineTo(-26,-38);
  ctx.closePath();
  ctx.fill();

  /* armor */

  ctx.strokeStyle="#b73745";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-27,-90);
  ctx.lineTo(27,-90);
  ctx.stroke();

  /* arms */

  ctx.strokeStyle="#4a1824";
  ctx.lineWidth=15;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-30,-92);
  ctx.lineTo(-48,-48);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(30,-92);
  ctx.lineTo(48,-48);
  ctx.stroke();

  /* head */

  ctx.fillStyle="#4c1721";

  ctx.beginPath();
  ctx.arc(0,-132,26,0,Math.PI*2);
  ctx.fill();

  /* horns */

  ctx.fillStyle="#e2a052";

  ctx.beginPath();
  ctx.moveTo(-17,-148);
  ctx.lineTo(-38,-183);
  ctx.lineTo(-9,-157);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(17,-148);
  ctx.lineTo(38,-183);
  ctx.lineTo(9,-157);
  ctx.closePath();
  ctx.fill();

  /* eyes */

  ctx.fillStyle="#ffb000";

  ctx.fillRect(
    e.facing>0?7:-13,
    -136,
    7,
    4
  );

  /* weapon */

  const swing=
    e.attackAnim>0?
    Math.sin(e.attackAnim*20)*.8:
    0;

  ctx.save();

  ctx.translate(
    e.facing>0?48:-48,
    -55
  );

  ctx.rotate(
    e.facing>0?
    -.8+swing:
    .8-swing
  );

  ctx.fillStyle="#181016";
  ctx.fillRect(-5,0,10,25);

  ctx.fillStyle="#d23a45";

  ctx.beginPath();
  ctx.moveTo(-7,0);
  ctx.lineTo(7,0);
  ctx.lineTo(5,-90);
  ctx.lineTo(0,-110);
  ctx.lineTo(-5,-90);
  ctx.closePath();
  ctx.fill();

  ctx.restore();

  ctx.restore();
}

/* ---------------- EFFECTS ---------------- */

function drawParticles(){

  particles.forEach(p=>{

    const q=project(p.x,p.y,p.z);

    ctx.globalAlpha=Math.max(0,p.life/p.max);

    ctx.fillStyle=p.color;

    ctx.beginPath();
    ctx.arc(
      q.x,
      q.y,
      p.size*q.scale,
      0,
      Math.PI*2
    );

    ctx.fill();
  });

  ctx.globalAlpha=1;
}

function drawTexts(){

  texts.forEach(t=>{

    ctx.globalAlpha=t.life;

    ctx.fillStyle="#fff";
    ctx.font="bold 24px Arial";
    ctx.textAlign="center";

    ctx.shadowColor="#000";
    ctx.shadowBlur=8;

    ctx.fillText(
      t.text,
      t.x,
      t.y
    );

    ctx.shadowBlur=0;
  });

  ctx.globalAlpha=1;
}

function drawSlashes(){

  slashes.forEach(s=>{

    const progress=1-s.life/s.max;

    ctx.save();

    ctx.translate(s.x,s.y);

    ctx.rotate(
      s.rot+
      (s.flip?Math.PI:0)
    );

    ctx.globalAlpha=
      Math.max(0,s.life/s.max);

    ctx.strokeStyle=
      s.strong?
      "#c66cff":
      "#8ed7ff";

    ctx.lineWidth=
      s.strong?12:7;

    ctx.lineCap="round";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      s.strong?90:70,
      -1.1+progress,
      1.1+progress
    );

    ctx.stroke();

    ctx.restore();
  });

  ctx.globalAlpha=1;
}

/* ---------------- RENDER ---------------- */

let last=performance.now();

function render(time){

  const dt=Math.min(
    .033,
    (time-last)/1000
  );

  last=time;

  update(dt);

  ctx.save();

  let sx=0;
  let sy=0;

  if(cameraShake>0){
    sx=(Math.random()-.5)*cameraShake;
    sy=(Math.random()-.5)*cameraShake;
  }

  ctx.translate(sx,sy);

  drawBackground(time);
  drawArena();

  drawWarrior(player,time);
  drawDemon(enemy,time);

  drawParticles();
  drawSlashes();
  drawTexts();

  ctx.restore();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

/* ---------------- GAME START ---------------- */

function resetBattle(){

  player.x=-3;
  player.z=0;
  player.hp=100;
  player.maxHP=100;
  player.energy=100;
  player.attackCooldown=0;
  player.dashCooldown=0;
  player.skillCooldown=0;
  player.block=false;

  enemy.x=3;
  enemy.hp=150+save.level*15;
  enemy.maxHP=150+save.level*15;
  enemy.energy=100;
  enemy.attackCooldown=1;
  enemy.skillCooldown=4;
  enemy.phase=1;

  combo=0;
  comboTimer=0;

  particles=[];
  texts=[];
  slashes=[];

  gameOver=false;
  paused=false;

  updateHUD();
  updateCombo();
}

function startGame(){

  document.getElementById("intro").style.display="none";

  running=true;

  resetBattle();

  beep(220,.12);
}

function endGame(win){

  if(gameOver)return;

  gameOver=true;

  if(win){

    const rewardXP=60+save.level*15;
    const rewardCoins=40+save.level*10;

    addXP(rewardXP);

    save.coins+=rewardCoins;
    saveGame();

    document.getElementById("resultTitle").textContent=
      "VICTORY";

    document.getElementById("resultText").textContent=
      "Boss dikalahkan! +" +
      rewardXP +
      " XP • +" +
      rewardCoins +
      " Coins";

    for(let i=0;i<70;i++){
      particle(
        enemy.x,
        Math.random()*3,
        (Math.random()-.5)*3,
        Math.random()<.5?"#ffd34e":"#8b6cff",
        3+Math.random()*5
      );
    }

    beep(520,.3);
  }else{

    document.getElementById("resultTitle").textContent=
      "DEFEAT";

    document.getElementById("resultText").textContent=
      "Warrior tumbang. Bangkit dan coba lagi!";

    beep(80,.4,"sawtooth");
  }

  document.getElementById("centerMessage").style.display="block";
}

function restartGame(){

  document.getElementById("centerMessage").style.display="none";

  resetBattle();
  running=true;
}

/* ---------------- PAUSE ---------------- */

document.getElementById("pauseBtn").onclick=()=>{

  if(!running||gameOver)return;

  paused=true;

  document.getElementById("pauseLayer").style.display="flex";
};

document.getElementById("resumeBtn").onclick=()=>{

  paused=false;

  document.getElementById("pauseLayer").style.display="none";
};

document.getElementById("soundBtn").onclick=()=>{

  sound=!sound;

  document.getElementById("soundBtn").textContent=
    sound?"🔊":"🔇";
};

document.getElementById("startBtn").onclick=startGame;
document.getElementById("restartBtn").onclick=restartGame;

/* ---------------- MOBILE CONTROLS ---------------- */

function holdButton(id,down,up){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    down();
  });

  b.addEventListener("pointerup",e=>{
    e.preventDefault();
    up();
  });

  b.addEventListener("pointercancel",up);
  b.addEventListener("pointerleave",up);
}

holdButton(
  "leftBtn",
  ()=>keys.ArrowLeft=true,
  ()=>keys.ArrowLeft=false
);

holdButton(
  "rightBtn",
  ()=>keys.ArrowRight=true,
  ()=>keys.ArrowRight=false
);

holdButton(
  "blockBtn",
  ()=>player.block=true,
  ()=>player.block=false
);

document.getElementById("attackBtn")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    attack();
  });

document.getElementById("dashBtn")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    dash();
  });

document.getElementById("skillBtn")
  .addEventListener("pointerdown",e=>{
    e.preventDefault();
    skill();
  });

/* ---------------- EXTRA KEYBOARD ---------------- */

addEventListener("keydown",e=>{

  if(e.code==="KeyJ")attack();
  if(e.code==="KeyK")heavy();
  if(e.code==="KeyL")skill();

});

/* ---------------- INIT ---------------- */

updateHUD();

</script>
