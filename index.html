<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ALFA RACING V5 | PS2 STYLE</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
 width:100%;height:100%;overflow:hidden;
 background:#050505;
 font-family:Arial,Helvetica,sans-serif;
 touch-action:none;
}
canvas{display:block}

#hud{
 position:fixed;
 top:12px;
 left:12px;
 right:12px;
 z-index:10;
 color:#fff;
 pointer-events:none;
 text-shadow:2px 2px 5px #000;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 gap:10px;
}
.box{
 background:rgba(0,0,0,.55);
 border:1px solid rgba(255,255,255,.2);
 border-radius:12px;
 padding:9px 13px;
 backdrop-filter:blur(5px);
}
.title{
 font-weight:900;
 font-size:20px;
 letter-spacing:2px;
}
.small{font-size:11px;opacity:.8}
.stat{
 font-size:15px;
 font-weight:bold;
 margin-top:3px;
}

#speed{
 position:fixed;
 bottom:20px;
 left:20px;
 z-index:20;
 color:white;
 font-size:42px;
 font-weight:900;
 text-shadow:3px 3px 7px #000;
}
#speed span{
 font-size:14px;
}

#nitroBar{
 position:fixed;
 bottom:18px;
 left:50%;
 transform:translateX(-50%);
 width:220px;
 height:14px;
 border:2px solid white;
 border-radius:20px;
 background:rgba(0,0,0,.6);
 overflow:hidden;
 z-index:20;
}
#nitroFill{
 height:100%;
 width:100%;
 background:linear-gradient(90deg,#00d9ff,#0066ff,#a600ff);
}

#message{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 color:white;
 text-align:center;
 z-index:50;
 display:none;
}
#message h1{
 font-size:54px;
 font-weight:1000;
 text-shadow:0 0 20px #000;
}
#message button{
 margin-top:20px;
 padding:14px 28px;
 border:0;
 border-radius:12px;
 font-weight:bold;
 font-size:18px;
 cursor:pointer;
}

#controls{
 position:fixed;
 left:0;
 right:0;
 bottom:55px;
 z-index:30;
 display:flex;
 justify-content:space-between;
 padding:0 18px;
 pointer-events:none;
}
.controlGroup{
 display:flex;
 gap:10px;
 pointer-events:auto;
}
.btn{
 width:65px;
 height:65px;
 border-radius:50%;
 border:2px solid rgba(255,255,255,.4);
 background:rgba(0,0,0,.45);
 color:white;
 display:flex;
 justify-content:center;
 align-items:center;
 font-size:25px;
 font-weight:bold;
 user-select:none;
}
.btn:active{
 transform:scale(.9);
 background:rgba(255,255,255,.25);
}
#start{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 justify-content:center;
 align-items:center;
 background:
 radial-gradient(circle at center,rgba(20,20,20,.2),rgba(0,0,0,.92));
 color:white;
 text-align:center;
}
.startBox{
 width:min(90%,520px);
 padding:35px;
 border-radius:22px;
 background:rgba(10,10,10,.8);
 border:1px solid rgba(255,255,255,.2);
 box-shadow:0 20px 70px #000;
}
.startBox h1{
 font-size:42px;
 letter-spacing:4px;
}
.startBox h2{
 margin-top:8px;
 font-size:17px;
 opacity:.75;
}
.startBox p{
 margin:18px 0;
 line-height:1.6;
 opacity:.85;
}
#startBtn{
 padding:16px 35px;
 border:0;
 border-radius:14px;
 font-size:19px;
 font-weight:900;
 cursor:pointer;
}
@media(max-width:600px){
 .title{font-size:15px}
 .box{padding:7px 9px}
 #speed{font-size:32px}
 .btn{width:58px;height:58px}
}
</style>
</head>

<body>

<div id="start">
 <div class="startBox">
  <h1>ALFA RACING</h1>
  <h2>V5 • PS2 STYLE EXPERIMENT</h2>
  <p>
   Race • Nitro • AI • Drift • Collision • Rain<br>
   Eksperimen game balap 3D gratis berbasis web.
  </p>
  <button id="startBtn">START RACE</button>
 </div>
</div>

<div id="hud">
 <div class="top">
  <div class="box">
   <div class="title">ALFA RACING</div>
   <div class="small">PS2 STYLE EXPERIMENT</div>
  </div>

  <div class="box">
   <div class="stat">LAP <span id="lap">1</span>/3</div>
   <div class="stat">POS <span id="pos">1</span>/6</div>
  </div>
 </div>
</div>

<div id="speed">0 <span>KM/H</span></div>

<div id="nitroBar">
 <div id="nitroFill"></div>
</div>

<div id="message">
 <h1 id="messageTitle">FINISH!</h1>
 <button onclick="restartGame()">RACE AGAIN</button>
</div>

<div id="controls">
 <div class="controlGroup">
  <div class="btn" id="left">◀</div>
  <div class="btn" id="right">▶</div>
 </div>

 <div class="controlGroup">
  <div class="btn" id="brake">▼</div>
  <div class="btn" id="nitro">⚡</div>
  <div class="btn" id="gas">▲</div>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;
let player;
let opponents=[];
let roadSegments=[];
let trees=[];
let coins=[];
let particles=[];
let rain=[];

let speed=0;
let maxSpeed=1.15;
let acceleration=.018;
let brakePower=.035;
let steering=0;

let nitro=100;
let nitroActive=false;

let lap=1;
let distance=0;
let totalDistance=0;

let running=false;
let finished=false;

const keys={};

const clock=new THREE.Clock();

function init(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x87a7c4);
 scene.fog=new THREE.Fog(0x87a7c4,35,240);

 camera=new THREE.PerspectiveCamera(
  65,
  innerWidth/innerHeight,
  .1,
  700
 );

 camera.position.set(0,5,10);

 renderer=new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;

 document.body.appendChild(renderer.domElement);

 setupLights();
 createWorld();
 createPlayer();
 createOpponents();
 createCoins();
 createRain();

 window.addEventListener("resize",resize);

 animate();
}

function setupLights(){

 const hemi=new THREE.HemisphereLight(
  0xbdd8ff,
  0x334422,
  1.8
 );
 scene.add(hemi);

 const sun=new THREE.DirectionalLight(
  0xffffff,
  2.2
 );

 sun.position.set(-80,100,60);
 sun.castShadow=true;

 sun.shadow.mapSize.width=1024;
 sun.shadow.mapSize.height=1024;

 scene.add(sun);

}

function mat(color){

 return new THREE.MeshStandardMaterial({
  color,
  roughness:.75,
  metalness:.12
 });

}

function createWorld(){

 const grass=new THREE.Mesh(
  new THREE.PlaneGeometry(1000,1000),
  mat(0x263c20)
 );

 grass.rotation.x=-Math.PI/2;
 grass.position.y=-.08;
 grass.receiveShadow=true;

 scene.add(grass);

 // road

 for(let i=0;i<180;i++){

  const z=-i*6;

  const curve=Math.sin(i*.075)*9+
               Math.sin(i*.021)*15;

  const road=new THREE.Mesh(
   new THREE.BoxGeometry(16,.18,6.2),
   mat(0x303030)
  );

  road.position.set(curve,0,z);

  road.receiveShadow=true;

  scene.add(road);
  roadSegments.push(road);

  // lane markings

  if(i%2===0){

   const line=new THREE.Mesh(
    new THREE.BoxGeometry(.28,.04,2.1),
    mat(0xffffff)
   );

   line.position.set(curve,.12,z);
   scene.add(line);

  }

  // roadside

  if(i%3===0){

   createTree(curve-12,z);
   createTree(curve+12,z);

  }

  if(i%11===0){
   createLamp(curve-9,z);
   createLamp(curve+9,z);
  }

 }

 // mountains

 for(let i=0;i<18;i++){

  const mountain=new THREE.Mesh(
   new THREE.ConeGeometry(
    12+Math.random()*18,
    25+Math.random()*25,
    7
   ),
   mat(0x334d42)
  );

  mountain.position.set(
   (i%2===0?-1:1)*(45+Math.random()*25),
   10,
   -i*50-30
  );

  scene.add(mountain);

 }

}

function createTree(x,z){

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.35,.5,3,8),
  mat(0x5b3924)
 );

 trunk.position.set(x,1.5,z);

 trunk.castShadow=true;

 scene.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.ConeGeometry(2.3,5.5,8),
  mat(0x174b26)
 );

 crown.position.set(x,5,z);
 crown.castShadow=true;

 scene.add(crown);

 trees.push({trunk,crown});

}

function createLamp(x,z){

 const pole=new THREE.Mesh(
  new THREE.CylinderGeometry(.08,.1,5,8),
  mat(0x222222)
 );

 pole.position.set(x,2.5,z);

 scene.add(pole);

 const lamp=new THREE.Mesh(
  new THREE.SphereGeometry(.25,10,10),
  new THREE.MeshBasicMaterial({
   color:0xffffcc
  })
 );

 lamp.position.set(x,5,z);

 scene.add(lamp);

}

function createCar(color){

 const group=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,.55,4),
  mat(color)
 );

 body.position.y=.75;
 body.castShadow=true;

 group.add(body);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,.55,1.8),
  mat(color)
 );

 roof.position.set(0,1.15,-.15);
 roof.castShadow=true;

 group.add(roof);

 const glass=new THREE.Mesh(
  new THREE.BoxGeometry(1.45,.35,1.5),
  new THREE.MeshStandardMaterial({
   color:0x101820,
   metalness:.3,
   roughness:.2
  })
 );

 glass.position.set(0,1.43,-.15);

 group.add(glass);

 const bumper=new THREE.Mesh(
  new THREE.BoxGeometry(2.15,.25,.25),
  mat(0x111111)
 );

 bumper.position.set(0,.55,1.98);
 group.add(bumper);

 // wheels

 [-1.15,1.15].forEach(x=>{

  [-1.35,1.35].forEach(z=>{

   const wheel=new THREE.Mesh(
    new THREE.CylinderGeometry(.43,.43,.32,16),
    mat(0x080808)
   );

   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.48,z);

   wheel.castShadow=true;

   group.add(wheel);

  });

 });

 return group;

}

function createPlayer(){

 player=createCar(0xff2020);

 player.position.set(0,0,0);

 scene.add(player);

}

function createOpponents(){

 const colors=[
  0x176cff,
  0xffc400,
  0x7c20ff,
  0xffffff,
  0x00c878
 ];

 for(let i=0;i<5;i++){

  const car=createCar(colors[i]);

  car.position.set(
   (i-2)*2.7,
   0,
   -18-i*15
  );

  scene.add(car);

  opponents.push({
   mesh:car,
   lane:(i-2)*2.7,
   speed:.62+Math.random()*.22,
   phase:Math.random()*10,
   distance:i*15+20
  });

 }

}

function createCoins(){

 for(let i=0;i<40;i++){

  const coin=new THREE.Mesh(
   new THREE.TorusGeometry(.35,.11,8,16),
   new THREE.MeshStandardMaterial({
    color:0xffd21f,
    emissive:0x553300,
    metalness:.8
   })
  );

  coin.position.set(
   (Math.random()-.5)*8,
   1,
   -25-i*15
  );

  coin.rotation.x=Math.PI/2;

  scene.add(coin);
  coins.push(coin);

 }

}

function createRain(){

 for(let i=0;i<500;i++){

  const drop=new THREE.Mesh(
   new THREE.BoxGeometry(.025,.7,.025),
   new THREE.MeshBasicMaterial({
    color:0xaad7ff,
    transparent:true,
    opacity:.45
   })
  );

  drop.position.set(
   (Math.random()-.5)*180,
   Math.random()*50,
   -Math.random()*300
  );

  scene.add(drop);
  rain.push(drop);

 }

}

function createSmoke(pos){

 for(let i=0;i<4;i++){

  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.08+Math.random()*.12,7,7),
   new THREE.MeshBasicMaterial({
    color:0xaaaaaa,
    transparent:true,
    opacity:.55
   })
  );

  p.position.copy(pos);

  p.position.y+=.25;

  scene.add(p);

  particles.push({
   mesh:p,
   life:1,
   vx:(Math.random()-.5)*.025,
   vy:.015+Math.random()*.02,
   vz:.02
  });

 }

}

function updateParticles(){

 for(let i=particles.length-1;i>=0;i--){

  const p=particles[i];

  p.life-=.025;

  p.mesh.position.x+=p.vx;
  p.mesh.position.y+=p.vy;
  p.mesh.position.z+=p.vz;

  p.mesh.scale.multiplyScalar(1.04);

  p.mesh.material.opacity=p.life*.5;

  if(p.life<=0){

   scene.remove(p.mesh);
   particles.splice(i,1);

  }

 }

}

function updateRain(){

 for(const d of rain){

  d.position.y-=.8;

  d.position.z+=.35;

  if(d.position.y<0){

   d.position.y=45+Math.random()*10;
   d.position.z=player.position.z-Math.random()*250;

  }

 }

}

function updatePlayer(dt){

 let gas=keys.ArrowUp||keys.w;
 let brake=keys.ArrowDown||keys.s;

 if(gas){

  speed+=acceleration;

 }else{

  speed*=.992;

 }

 if(brake){

  speed-=brakePower;

 }

 if(speed<0)speed=0;

 let targetMax=maxSpeed;

 nitroActive=false;

 if(keys.Shift||keys[" "]){
  if(nitro>0 && speed>.2){

   targetMax=1.85;
   speed+=.035;
   nitro-=.6;
   nitroActive=true;

  }
 }else{

  nitro+=.18;

 }

 nitro=Math.max(0,Math.min(100,nitro));

 speed=Math.min(speed,targetMax);

 let turn=0;

 if(keys.ArrowLeft||keys.a)turn=-1;
 if(keys.ArrowRight||keys.d)turn=1;

 steering+=(turn-steering)*.14;

 player.position.x+=steering*speed*1.35;

 // road boundary

 player.position.x=Math.max(-7,Math.min(7,player.position.x));

 // move world toward player

 const movement=speed*dt*58;

 player.position.z-=movement;

 distance+=movement;
 totalDistance+=movement;

 // pseudo endless track

 for(const r of roadSegments){

  if(r.position.z>player.position.z+30){

   r.position.z-=1080;

  }

 }

 for(const t of trees){

  if(t.trunk.position.z>player.position.z+40){

   t.trunk.position.z-=1080;
   t.crown.position.z-=1080;

  }

 }

 for(const c of coins){

  if(c.position.z>player.position.z+30){

   c.position.z-=600;

  }

  c.rotation.y+=.08;

 }

 // smoke

 if(speed>.45){

  createSmoke(
   new THREE.Vector3(
    player.position.x,
    .35,
    player.position.z+1.8
   )
  );

 }

 // lap

 if(distance>600){

  distance=0;
  lap++;

  if(lap>3){

   finishRace();

  }

 }

}

function updateOpponents(dt){

 for(const o of opponents){

  o.mesh.position.z+=
   (o.speed*dt*58);

  o.phase+=.02;

  o.mesh.position.x=
   o.lane+
   Math.sin(o.phase)*.65;

  // recycle

  if(o.mesh.position.z>
     player.position.z+35){

   o.mesh.position.z=
    player.position.z-
    180-
    Math.random()*150;

  }

  // collision

  const dx=
   player.position.x-
   o.mesh.position.x;

  const dz=
   player.position.z-
   o.mesh.position.z;

  if(Math.abs(dx)<1.7 &&
     Math.abs(dz)<2.5){

   speed*=.55;

   player.position.x+=
    dx>0?.25:-.25;

   createImpact(
    player.position.clone()
   );

  }

 }

}

function createImpact(pos){

 for(let i=0;i<15;i++){

  const p=new THREE.Mesh(
   new THREE.SphereGeometry(.07,6,6),
   new THREE.MeshBasicMaterial({
    color:0xffa000
   })
  );

  p.position.copy(pos);

  scene.add(p);

  particles.push({
   mesh:p,
   life:.7,
   vx:(Math.random()-.5)*.15,
   vy:Math.random()*.12,
   vz:(Math.random()-.5)*.15
  });

 }

 if(navigator.vibrate)
  navigator.vibrate(80);

}

function updateCamera(){

 const shake=
  nitroActive?
  (Math.random()-.5)*.04:
  0;

 const target=new THREE.Vector3(
  player.position.x*.55+shake,
  4.1,
  player.position.z+9
 );

 camera.position.lerp(target,.09);

 const look=new THREE.Vector3(
  player.position.x,
  1,
  player.position.z-12
 );

 camera.lookAt(look);

}

function updateHUD(){

 document.getElementById("speed").innerHTML=
  Math.round(speed*180)+
  ' <span>KM/H</span>';

 document.getElementById("lap").textContent=
  Math.min(lap,3);

 document.getElementById("nitroFill").style.width=
  nitro+"%";

 // position

 let position=1;

 for(const o of opponents){

  if(o.mesh.position.z<
     player.position.z){

   position++;

  }

 }

 document.getElementById("pos").textContent=
  Math.min(position,6);

}

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);

 if(running&&!finished){

  updatePlayer(dt);
  updateOpponents(dt);
  updateParticles();
  updateRain();
  updateCamera();
  updateHUD();

 }

 renderer.render(scene,camera);

}

function finishRace(){

 finished=true;

 document.getElementById("messageTitle").textContent=
  "🏆 FINISH!";

 document.getElementById("message").style.display=
  "block";

}

function restartGame(){

 location.reload();

}

function resize(){

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);

}

function bindButton(id,key){

 const el=document.getElementById(id);

 const down=e=>{
  e.preventDefault();
  keys[key]=true;
 };

 const up=e=>{
  e.preventDefault();
  keys[key]=false;
 };

 el.addEventListener("pointerdown",down);
 el.addEventListener("pointerup",up);
 el.addEventListener("pointercancel",up);
 el.addEventListener("pointerleave",up);

}

window.addEventListener("keydown",e=>{
 keys[e.key]=true;

 if(e.key===" ")
  e.preventDefault();
});

window.addEventListener("keyup",e=>{
 keys[e.key]=false;
});

bindButton("left","ArrowLeft");
bindButton("right","ArrowRight");
bindButton("gas","ArrowUp");
bindButton("brake","ArrowDown");
bindButton("nitro","Shift");

document.getElementById("startBtn")
.addEventListener("click",()=>{

 document.getElementById("start").style.display="none";

 running=true;

});

init();

</script>

</body>
</html>
