<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ALFA RACING | 3D Racing Game</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#05070a;font-family:Arial,sans-serif}
body{touch-action:none}
canvas{display:block}

#menu,#finish{
 position:fixed;inset:0;z-index:50;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(135deg,#05070a,#101923,#030405);
 color:white;text-align:center;padding:20px
}
.box{
 width:min(460px,94vw);padding:35px 25px;
 background:rgba(8,11,16,.9);
 border:1px solid rgba(255,255,255,.15);
 border-radius:25px;
 box-shadow:0 20px 80px #000
}
h1{font-size:42px;letter-spacing:4px}
.red{color:#ff3030}
.sub{color:#aaa;margin:14px 0 25px;line-height:1.6}
button{
 border:0;border-radius:15px;padding:15px 30px;
 font-weight:bold;font-size:16px;color:white;
 background:#e92727;cursor:pointer
}
button:active{transform:scale(.94)}
.hide{display:none!important}

#hud{
 position:fixed;top:12px;left:12px;right:12px;
 z-index:20;display:flex;justify-content:space-between;
 pointer-events:none;color:#fff
}
.hudbox{
 background:rgba(0,0,0,.65);
 border:1px solid rgba(255,255,255,.15);
 border-radius:15px;padding:10px 14px;
 backdrop-filter:blur(8px)
}
.logo{font-weight:900;letter-spacing:2px}
.small{font-size:11px;color:#bbb;line-height:1.7}
#speed{font-size:25px;font-weight:900}
#countdown{
 position:fixed;left:50%;top:45%;
 transform:translate(-50%,-50%);
 z-index:30;color:white;font-size:80px;
 font-weight:900;text-shadow:0 5px 25px #000;
 pointer-events:none
}

#controls{
 position:fixed;left:0;right:0;bottom:18px;
 z-index:25;display:flex;
 justify-content:space-between;padding:0 18px;
 pointer-events:none
}
.group{display:flex;gap:10px;pointer-events:auto}
.ctrl{
 width:66px;height:66px;border-radius:20px;
 background:rgba(0,0,0,.7);
 border:1px solid rgba(255,255,255,.2);
 color:#fff;font-size:25px
}
.nitro{
 width:82px;font-size:12px;
 background:rgba(0,80,130,.75)
}

@media(max-width:600px){
 h1{font-size:32px}
 .ctrl{width:60px;height:60px}
 #speed{font-size:20px}
}
</style>
</head>

<body>

<div id="menu">
 <div class="box">
  <h1><span class="red">ALFA</span><br>RACING</h1>
  <div class="sub">
   3D Racing Experience<br>
   Hindari lawan, gunakan nitro, drift dan taklukkan 3 lap.
  </div>
  <button id="start">🏁 MULAI BALAP</button>
  <div class="small" style="margin-top:18px">
   PC: W / ↑ = Gas · S / ↓ = Rem · A/D = Belok · Space = Nitro
  </div>
 </div>
</div>

<div id="finish" class="hide">
 <div class="box">
  <h1>🏆 FINISH!</h1>
  <div class="sub" id="result"></div>
  <button id="restart">🔄 BALAP LAGI</button>
 </div>
</div>

<div id="hud">
 <div class="hudbox">
  <div class="logo"><span class="red">ALFA</span> RACING</div>
  <div class="small">
   LAP <b id="lap">1</b>/3<br>
   CHECKPOINT <b id="cp">0</b>/8<br>
   COIN <b id="coin">0</b><br>
   SCORE <b id="score">0</b>
  </div>
 </div>

 <div class="hudbox" style="text-align:right">
  <div id="speed">0</div>
  <div class="small">KM/H</div>
  <div class="small">NITRO <b id="nitro">100</b>%</div>
  <div class="small">POSISI <b id="pos">1</b>/4</div>
 </div>
</div>

<div id="countdown"></div>

<div id="controls">
 <div class="group">
  <button class="ctrl" id="left">◀</button>
  <button class="ctrl" id="right">▶</button>
 </div>

 <div class="group">
  <button class="ctrl" id="brake">▼</button>
  <button class="ctrl" id="gas">▲</button>
  <button class="ctrl nitro" id="boost">NITRO</button>
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene,camera,renderer,car;
let opponents=[];
let roadParts=[];
let trees=[];
let coins=[];
let barriers=[];
let checkpoints=[];

let running=false;
let countdown=false;

let speed=0;
let steer=0;
let nitro=100;
let score=0;
let coinCount=0;
let lap=1;
let checkpoint=0;
let distance=0;
let playerProgress=0;

const keys={
 left:false,right:false,gas:false,brake:false,nitro:false
};

const ROAD=12;
const LANES=[-3.8,0,3.8];
const SEG=10;
const TOTAL=180;

function init(){

 scene=new THREE.Scene();

 scene.background=new THREE.Color(0x6d9bc8);
 scene.fog=new THREE.Fog(0x6d9bc8,45,170);

 camera=new THREE.PerspectiveCamera(
  65,innerWidth/innerHeight,.1,400
 );

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 document.body.appendChild(renderer.domElement);

 lighting();
 world();
 createPlayer();
 createOpponents();
 createCoins();
 createCheckpoints();

 window.addEventListener("resize",resize);

 animate();
}

function lighting(){

 scene.add(new THREE.HemisphereLight(
  0xffffff,0x29442c,2.2
 ));

 const sun=new THREE.DirectionalLight(
  0xffffff,3
 );
 sun.position.set(30,60,20);
 sun.castShadow=true;
 scene.add(sun);
}

function world(){

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(500,500),
  new THREE.MeshStandardMaterial({color:0x2e6835})
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-.1;
 ground.receiveShadow=true;
 scene.add(ground);

 for(let i=0;i<TOTAL;i++){

  const g=new THREE.Group();

  const road=new THREE.Mesh(
   new THREE.BoxGeometry(ROAD,.12,SEG),
   new THREE.MeshStandardMaterial({color:0x24282d})
  );
  road.receiveShadow=true;
  g.add(road);

  const center=new THREE.Mesh(
   new THREE.BoxGeometry(.13,.04,3),
   new THREE.MeshBasicMaterial({color:0xffffff})
  );
  center.position.y=.08;
  g.add(center);

  for(const x of [-ROAD/2,ROAD/2]){
   const edge=new THREE.Mesh(
    new THREE.BoxGeometry(.22,.05,SEG),
    new THREE.MeshBasicMaterial({color:0xffd500})
   );
   edge.position.set(x,.09,0);
   g.add(edge);
  }

  g.position.z=-i*SEG;
  scene.add(g);
  roadParts.push(g);

  if(i%4===0){
   makeTree(-9,-i*SEG);
   makeTree(9,-i*SEG);
  }
 }
}

function makeTree(x,z){

 const g=new THREE.Group();

 const trunk=new THREE.Mesh(
  new THREE.CylinderGeometry(.25,.35,2,8),
  new THREE.MeshStandardMaterial({color:0x70401f})
 );
 trunk.position.y=1;
 g.add(trunk);

 const crown=new THREE.Mesh(
  new THREE.SphereGeometry(1.5,10,8),
  new THREE.MeshStandardMaterial({color:0x155b25})
 );
 crown.position.y=2.8;
 crown.castShadow=true;
 g.add(crown);

 g.position.set(x,0,z);
 scene.add(g);
 trees.push(g);
}

function carModel(color){

 const g=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,.65,4.3),
  new THREE.MeshStandardMaterial({
   color,metalness:.45,roughness:.3
  })
 );
 body.position.y=.65;
 body.castShadow=true;
 g.add(body);

 const hood=new THREE.Mesh(
  new THREE.BoxGeometry(2.05,.18,1.25),
  new THREE.MeshStandardMaterial({color:color})
 );
 hood.position.set(0,1.0,-1.35);
 g.add(hood);

 const cabin=new THREE.Mesh(
  new THREE.BoxGeometry(1.65,.7,1.8),
  new THREE.MeshStandardMaterial({
   color:0x10161d,
   metalness:.1,
   roughness:.1
  })
 );
 cabin.position.set(0,1.15,.05);
 cabin.castShadow=true;
 g.add(cabin);

 const wheelGeo=new THREE.CylinderGeometry(.47,.47,.36,18);
 const wheelMat=new THREE.MeshStandardMaterial({color:0x070707});

 for(const p of [
  [-1.22,.45,-1.45],
  [1.22,.45,-1.45],
  [-1.22,.45,1.45],
  [1.22,.45,1.45]
 ]){
  const w=new THREE.Mesh(wheelGeo,wheelMat);
  w.rotation.z=Math.PI/2;
  w.position.set(...p);
  w.castShadow=true;
  g.add(w);
 }

 const lightMat=new THREE.MeshBasicMaterial({color:0xffffdd});

 for(const x of [-.65,.65]){
  const l=new THREE.Mesh(
   new THREE.BoxGeometry(.38,.2,.08),
   lightMat
  );
  l.position.set(x,.72,-2.18);
  g.add(l);
 }

 return g;
}

function createPlayer(){

 car=carModel(0xe32929);
 car.position.set(0,0,4);
 scene.add(car);
}

function createOpponents(){

 const colors=[0x1d73d1,0xffa600,0x7a32d1];

 colors.forEach((color,i)=>{

  const o=carModel(color);

  o.position.set(
   LANES[i],
   0,
   -15-i*12
  );

  o.userData={
   speed:.52+Math.random()*.13,
   progress:i*8,
   lane:LANES[i],
   target:LANES[i],
   change:Math.random()*100
  };

  scene.add(o);
  opponents.push(o);
 });
}

function createCoins(){

 for(let i=8;i<TOTAL-5;i+=6){

  const lane=LANES[
   Math.floor(Math.random()*3)
  ];

  const coin=new THREE.Mesh(
   new THREE.TorusGeometry(.48,.14,12,22),
   new THREE.MeshStandardMaterial({
    color:0xffd700,
    emissive:0x664400,
    metalness:.8
   })
  );

  coin.position.set(
   lane,1.2,-i*SEG
  );

  coin.rotation.x=Math.PI/2;
  scene.add(coin);
  coins.push(coin);
 }
}

function createCheckpoints(){

 for(let i=1;i<=8;i++){

  const z=-i*220;

  const g=new THREE.Group();

  const left=new THREE.Mesh(
   new THREE.BoxGeometry(.35,4,.35),
   new THREE.MeshStandardMaterial({color:0xff3030})
  );

  left.position.set(-5.7,2,0);
  g.add(left);

  const right=left.clone();
  right.position.x=5.7;
  g.add(right);

  const top=new THREE.Mesh(
   new THREE.BoxGeometry(11.7,.4,.35),
   new THREE.MeshStandardMaterial({color:0xffd000})
  );
  top.position.y=4;
  g.add(top);

  g.position.z=z;
  scene.add(g);
  checkpoints.push(g);
 }
}

function bind(id,key){

 const el=document.getElementById(id);

 ["pointerdown"].forEach(ev=>{
  el.addEventListener(ev,e=>{
   e.preventDefault();
   keys[key]=true;
  });
 });

 ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
  el.addEventListener(ev,e=>{
   e.preventDefault();
   keys[key]=false;
  });
 });
}

bind("left","left");
bind("right","right");
bind("gas","gas");
bind("brake","brake");
bind("boost","nitro");

window.addEventListener("keydown",e=>{

 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
  keys.left=true;

 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
  keys.right=true;

 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
  keys.gas=true;

 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
  keys.brake=true;

 if(e.code==="Space")
  keys.nitro=true;
});

window.addEventListener("keyup",e=>{

 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
  keys.left=false;

 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
  keys.right=false;

 if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
  keys.gas=false;

 if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
  keys.brake=false;

 if(e.code==="Space")
  keys.nitro=false;
});

document.getElementById("start").onclick=startGame;
document.getElementById("restart").onclick=()=>location.reload();

function startGame(){

 document.getElementById("menu").classList.add("hide");

 let n=3;
 const el=document.getElementById("countdown");

 countdown=true;
 el.textContent=n;

 const timer=setInterval(()=>{

  n--;

  if(n>0){
   el.textContent=n;
  }else{
   el.textContent="GO!";
   setTimeout(()=>{
    el.textContent="";
    countdown=false;
    running=true;
   },700);
   clearInterval(timer);
  }

 },900);
}

function update(){

 if(!running||countdown)return;

 /* ACCELERATION */

 if(keys.gas){
  speed+=.024;
 }else{
  speed-=.012;
 }

 if(keys.brake)
  speed-=.045;

 speed=Math.max(0,Math.min(speed,1.35));

 /* NITRO */

 if(keys.nitro&&nitro>0&&speed>.2){
  speed+=.045;
  nitro-=.9;
 }else{
  nitro=Math.min(100,nitro+.07);
 }

 /* STEERING */

 if(keys.left)steer-=.055;
 if(keys.right)steer+=.055;

 if(!keys.left&&!keys.right)
  steer*=.88;

 steer=Math.max(-.8,Math.min(.8,steer));

 car.position.x+=steer*speed*.85;

 car.position.x=Math.max(-4.7,Math.min(4.7,car.position.x));

 car.rotation.y=-steer*.18;
 car.rotation.z=-steer*.07;

 /* WORLD */

 const move=speed;

 roadParts.forEach(r=>{
  r.position.z+=move;

  if(r.position.z>15)
   r.position.z-=TOTAL*SEG;
 });

 trees.forEach(t=>{
  t.position.z+=move;

  if(t.position.z>20)
   t.position.z-=TOTAL*SEG;
 });

 coins.forEach(c=>{
  c.position.z+=move;
  c.rotation.y+=.08;

  if(c.position.z>15){
   c.position.z-=TOTAL*SEG;
   c.visible=true;
  }

  if(c.visible&&
     Math.abs(c.position.x-car.position.x)<1.4&&
     Math.abs(c.position.z-car.position.z)<2.2){

   c.visible=false;
   coinCount++;
   score+=100;
   nitro=Math.min(100,nitro+12);
  }
 });

 /* OPPONENT AI */

 opponents.forEach(o=>{

  o.position.z+=
   move-o.userData.speed;

  o.userData.change-=1;

  if(o.userData.change<0){
   o.userData.change=80+Math.random()*120;
   o.userData.target=
    LANES[Math.floor(Math.random()*3)];
  }

  o.position.x+=
   (o.userData.target-o.position.x)*.01;

  o.rotation.y=
   -(o.userData.target-o.position.x)*.04;

  if(o.position.z>15){
   o.position.z-=TOTAL*SEG;
   o.userData.progress+=TOTAL;
  }

  if(
   Math.abs(o.position.x-car.position.x)<1.8 &&
   Math.abs(o.position.z-car.position.z)<2.3
  ){
   speed*=.55;
   score=Math.max(0,score-30);

   o.position.z-=7;
  }
 });

 distance+=move;
 playerProgress+=move;

 /* CHECKPOINT */

 if(
  checkpoint<8 &&
  playerProgress>(checkpoint+1)*220
 ){
  checkpoint++;
  score+=250;
 }

 /* LAP */

 if(playerProgress>=1760){

  playerProgress=0;
  lap++;

  score+=1000;

  if(lap>3){
   finishGame();
   return;
  }
 }

 updatePosition();

 updateHUD();
}

function updatePosition(){

 let position=1;

 opponents.forEach(o=>{

  const opponentProgress=
   Math.abs(o.position.z);

  if(opponentProgress>
     Math.abs(car.position.z))
   position++;

 });

 document.getElementById("pos").textContent=
  Math.min(position,4);
}

function updateHUD(){

 document.getElementById("speed").textContent=
  Math.floor(speed*145);

 document.getElementById("nitro").textContent=
  Math.floor(nitro);

 document.getElementById("score").textContent=
  score;

 document.getElementById("coin").textContent=
  coinCount;

 document.getElementById("lap").textContent=
  Math.min(lap,3);

 document.getElementById("cp").textContent=
  checkpoint;
}

function updateCamera(){

 if(!car)return;

 const targetX=car.position.x*.32;

 camera.position.x+=
  (targetX-camera.position.x)*.09;

 camera.position.y+=
  (4.6-camera.position.y)*.09;

 camera.position.z+=
  (9-camera.position.z)*.09;

 camera.lookAt(
  car.position.x,
  .8,
  car.position.z-9
 );
}

function finishGame(){

 running=false;

 document.getElementById("finish")
  .classList.remove("hide");

 document.getElementById("result").innerHTML=
  "🏁 3 LAP SELESAI!<br><br>"+
  "Score: <b>"+score+"</b><br>"+
  "Coin: <b>"+coinCount+"</b><br><br>"+
  "ALFA RACING CHAMPION";
}

function animate(){

 requestAnimationFrame(animate);

 update();
 updateCamera();

 renderer.render(scene,camera);
}

function resize(){

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,innerHeight
 );
}

init();
</script>

</body>
</html>
