<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>ALFA RACING 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070b;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

#hud{
  position:fixed;
  top:12px;
  left:12px;
  right:12px;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.panel{
  background:rgba(0,0,0,.68);
  border:1px solid rgba(255,255,255,.15);
  border-radius:14px;
  padding:10px 14px;
  color:white;
  backdrop-filter:blur(8px);
  box-shadow:0 5px 25px rgba(0,0,0,.3);
}

.title{
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
}

.stats{
  margin-top:5px;
  font-size:12px;
  line-height:1.7;
}

#speed{
  font-size:25px;
  font-weight:900;
}

#message{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:20;
  text-align:center;
  color:white;
  background:rgba(0,0,0,.75);
  border:1px solid rgba(255,255,255,.2);
  padding:22px 30px;
  border-radius:20px;
  backdrop-filter:blur(10px);
  pointer-events:none;
}

#message h1{
  font-size:34px;
  margin-bottom:8px;
}

#message p{
  font-size:14px;
  opacity:.8;
}

.hidden{
  display:none!important;
}

#controls{
  position:fixed;
  left:0;
  right:0;
  bottom:18px;
  z-index:15;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.btn{
  width:68px;
  height:68px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.2);
  background:rgba(10,12,18,.78);
  color:white;
  font-size:25px;
  font-weight:bold;
  box-shadow:0 8px 25px rgba(0,0,0,.4);
  backdrop-filter:blur(8px);
  user-select:none;
}

.btn:active{
  transform:scale(.9);
  background:rgba(255,255,255,.25);
}

.nitro{
  width:82px;
  color:#5fdcff;
  font-size:14px;
}

#startScreen{
  position:fixed;
  inset:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(25,45,75,.45),rgba(0,0,0,.95));
  color:white;
  text-align:center;
  padding:25px;
}

.startBox{
  max-width:450px;
  width:100%;
  padding:35px 25px;
  border-radius:25px;
  background:rgba(10,12,18,.82);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.startBox h1{
  font-size:42px;
  letter-spacing:4px;
}

.startBox .red{
  color:#ff3b30;
}

.startBox p{
  margin:15px 0 25px;
  color:#bbb;
  line-height:1.6;
}

#startBtn{
  border:0;
  border-radius:15px;
  padding:15px 35px;
  background:#ff3b30;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(255,59,48,.3);
}

#startBtn:active{
  transform:scale(.95);
}

#hint{
  margin-top:15px;
  font-size:11px;
  color:#888;
}

@media(max-width:600px){
  .panel{
    padding:8px 11px;
  }

  .title{
    font-size:13px;
  }

  .stats{
    font-size:10px;
  }

  #speed{
    font-size:20px;
  }

  .btn{
    width:62px;
    height:62px;
    border-radius:18px;
  }

  .startBox h1{
    font-size:31px;
  }
}
</style>
</head>

<body>

<div id="hud">

  <div class="panel">
    <div class="title">
      <span class="red">ALFA</span> RACING
    </div>

    <div class="stats">
      🏁 Lap: <b id="lap">1</b>/3<br>
      🪙 Coin: <b id="coins">0</b><br>
      ⭐ Score: <b id="score">0</b>
    </div>
  </div>

  <div class="panel" style="text-align:right">
    <div id="speed">0</div>
    <div style="font-size:10px;color:#aaa">KM/H</div>
    <div class="stats">
      🚀 Nitro: <b id="nitro">100</b>%
    </div>
  </div>

</div>

<div id="message">
  <h1>🏁 FINISH!</h1>
  <p>Kamu menyelesaikan balapan.</p>
</div>

<div id="controls">

  <div class="controlGroup">
    <button class="btn" id="left">◀</button>
    <button class="btn" id="right">▶</button>
  </div>

  <div class="controlGroup">
    <button class="btn" id="brake">▼</button>
    <button class="btn" id="gas">▲</button>
    <button class="btn nitro" id="nitroBtn">NITRO</button>
  </div>

</div>

<div id="startScreen">

  <div class="startBox">

    <h1>
      <span class="red">ALFA</span><br>
      RACING 3D
    </h1>

    <p>
      Siap menjadi pembalap?<br>
      Hindari rintangan, kumpulkan coin,
      dan selesaikan 3 lap!
    </p>

    <button id="startBtn">
      🚗 MULAI BALAP
    </button>

    <div id="hint">
      PC: WASD / Arrow Keys<br>
      HP: gunakan tombol di layar
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let car;

let road;
let roadSegments=[];

let obstacles=[];
let coins=[];

let running=false;

let speed=0;
let maxSpeed=1.2;
let acceleration=.025;
let friction=.015;

let steering=0;

let score=0;
let coinCount=0;
let lap=1;

let nitroPower=100;

let distance=0;

let keys={
  left:false,
  right:false,
  gas:false,
  brake:false,
  nitro:false
};

const laneWidth=3.2;

const roadWidth=10;

const segmentLength=12;

const roadCount=80;


/* =========================
   INIT
========================= */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x78a9d8);

  scene.fog=new THREE.Fog(
    0x78a9d8,
    35,
    170
  );


  camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    300
  );


  renderer=new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.shadowMap.enabled=true;

  document.body.appendChild(
    renderer.domElement
  );


  createLights();

  createWorld();

  createCar();

  createObjects();

  resize();

  animate();

}


/* =========================
   LIGHT
========================= */

function createLights(){

  const hemi=new THREE.HemisphereLight(
    0xffffff,
    0x35516d,
    2.2
  );

  scene.add(hemi);


  const sun=new THREE.DirectionalLight(
    0xffffff,
    3
  );

  sun.position.set(
    20,
    40,
    20
  );

  sun.castShadow=true;

  scene.add(sun);

}


/* =========================
   WORLD
========================= */

function createWorld(){

  const groundGeo=
    new THREE.PlaneGeometry(
      500,
      500
    );

  const groundMat=
    new THREE.MeshStandardMaterial({
      color:0x285c31
    });

  const ground=
    new THREE.Mesh(
      groundGeo,
      groundMat
    );

  ground.rotation.x=-Math.PI/2;

  ground.position.y=-.05;

  scene.add(ground);


  for(
    let i=0;
    i<roadCount;
    i++
  ){

    createRoadSegment(i);

  }

}


function createRoadSegment(i){

  const group=new THREE.Group();

  const roadGeo=
    new THREE.BoxGeometry(
      roadWidth,
      .12,
      segmentLength
    );

  const roadMat=
    new THREE.MeshStandardMaterial({
      color:0x20242a
    });

  const r=
    new THREE.Mesh(
      roadGeo,
      roadMat
    );

  r.receiveShadow=true;

  group.add(r);


  const lineGeo=
    new THREE.BoxGeometry(
      .15,
      .03,
      4
    );

  const lineMat=
    new THREE.MeshBasicMaterial({
      color:0xffffff
    });

  const line=
    new THREE.Mesh(
      lineGeo,
      lineMat
    );

  line.position.y=.08;

  group.add(line);


  const edgeGeo=
    new THREE.BoxGeometry(
      .22,
      .05,
      segmentLength
    );

  const edgeMat=
    new THREE.MeshBasicMaterial({
      color:0xffd900
    });


  const leftEdge=
    new THREE.Mesh(
      edgeGeo,
      edgeMat
    );

  leftEdge.position.set(
    -roadWidth/2,
    .08,
    0
  );

  group.add(leftEdge);


  const rightEdge=
    leftEdge.clone();

  rightEdge.position.x=
    roadWidth/2;

  group.add(rightEdge);


  group.position.z=
    -i*segmentLength;

  scene.add(group);

  roadSegments.push(group);

}


/* =========================
   CAR
========================= */

function createCar(){

  car=new THREE.Group();


  const bodyGeo=
    new THREE.BoxGeometry(
      2.4,
      .65,
      4.2
    );

  const bodyMat=
    new THREE.MeshStandardMaterial({
      color:0xe52222,
      metalness:.5,
      roughness:.3
    });

  const body=
    new THREE.Mesh(
      bodyGeo,
      bodyMat
    );

  body.position.y=.65;

  body.castShadow=true;

  car.add(body);


  const cabinGeo=
    new THREE.BoxGeometry(
      1.7,
      .65,
      1.9
    );

  const cabinMat=
    new THREE.MeshStandardMaterial({
      color:0x101820,
      metalness:.2,
      roughness:.15
    });

  const cabin=
    new THREE.Mesh(
      cabinGeo,
      cabinMat
    );

  cabin.position.set(
    0,
    1.15,
    -.15
  );

  cabin.castShadow=true;

  car.add(cabin);


  const wheelGeo=
    new THREE.CylinderGeometry(
      .48,
      .48,
      .35,
      20
    );

  const wheelMat=
    new THREE.MeshStandardMaterial({
      color:0x090909
    });


  const wheelPositions=[
    [-1.25,.45,-1.45],
    [1.25,.45,-1.45],
    [-1.25,.45,1.45],
    [1.25,.45,1.45]
  ];


  wheelPositions.forEach(p=>{

    const w=
      new THREE.Mesh(
        wheelGeo,
        wheelMat
      );

    w.rotation.z=
      Math.PI/2;

    w.position.set(
      p[0],
      p[1],
      p[2]
    );

    w.castShadow=true;

    car.add(w);

  });


  const lightGeo=
    new THREE.BoxGeometry(
      .35,
      .2,
      .1
    );

  const lightMat=
    new THREE.MeshBasicMaterial({
      color:0xffffcc
    });


  [-.65,.65].forEach(x=>{

    const l=
      new THREE.Mesh(
        lightGeo,
        lightMat
      );

    l.position.set(
      x,
      .72,
      -2.1
    );

    car.add(l);

  });


  car.position.set(
    0,
    0,
    5
  );


  scene.add(car);

}


/* =========================
   OBJECTS
========================= */

function createObjects(){

  for(
    let i=8;
    i<roadCount-5;
    i+=5
  ){

    const z=
      -i*segmentLength;

    const lane=
      Math.floor(
        Math.random()*3
      )-1;

    createObstacle(
      lane*laneWidth,
      z
    );


    if(Math.random()>.25){

      createCoin(
        lane*laneWidth,
        z-4
      );

    }

  }

}


/* =========================
   OBSTACLE
========================= */

function createObstacle(x,z){

  const geo=
    new THREE.BoxGeometry(
      1.7,
      1.2,
      1.7
    );

  const mat=
    new THREE.MeshStandardMaterial({
      color:0xff8c00
    });

  const obj=
    new THREE.Mesh(
      geo,
      mat
    );

  obj.position.set(
    x,
    .6,
    z
  );

  obj.castShadow=true;

  scene.add(obj);

  obstacles.push(obj);

}


/* =========================
   COIN
========================= */

function createCoin(x,z){

  const geo=
    new THREE.TorusGeometry(
      .5,
      .15,
      12,
      24
    );

  const mat=
    new THREE.MeshStandardMaterial({
      color:0xffd700,
      emissive:0x664400,
      metalness:.7
    });

  const coin=
    new THREE.Mesh(
      geo,
      mat
    );

  coin.position.set(
    x,
    1.2,
    z
  );

  coin.rotation.x=
    Math.PI/2;

  scene.add(coin);

  coins.push(coin);

}


/* =========================
   INPUT
========================= */

function bindButton(id,key){

  const el=
    document.getElementById(id);

  el.addEventListener(
    "pointerdown",
    e=>{
      e.preventDefault();
      keys[key]=true;
    }
  );

  el.addEventListener(
    "pointerup",
    e=>{
      e.preventDefault();
      keys[key]=false;
    }
  );

  el.addEventListener(
    "pointercancel",
    ()=>{
      keys[key]=false;
    }
  );

  el.addEventListener(
    "pointerleave",
    ()=>{
      keys[key]=false;
    }
  );

}


bindButton("left","left");
bindButton("right","right");
bindButton("gas","gas");
bindButton("brake","brake");
bindButton("nitroBtn","nitro");


window.addEventListener(
  "keydown",
  e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
      keys.left=true;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
      keys.right=true;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
      keys.gas=true;

    if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
      keys.brake=true;

    if(e.key===" ")
      keys.nitro=true;

  }
);


window.addEventListener(
  "keyup",
  e=>{

    if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")
      keys.left=false;

    if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")
      keys.right=false;

    if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")
      keys.gas=false;

    if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")
      keys.brake=false;

    if(e.key===" ")
      keys.nitro=false;

  }
);


/* =========================
   START
========================= */

document
.getElementById("startBtn")
.addEventListener(
  "click",
  ()=>{

    document
      .getElementById("startScreen")
      .classList.add("hidden");

    running=true;

  }
);


/* =========================
   GAME
========================= */

function update(){

  if(!running)
    return;


  /* GAS */

  if(keys.gas){

    speed+=acceleration;

    if(speed>maxSpeed)
      speed=maxSpeed;

  }
  else{

    speed-=friction;

    if(speed<0)
      speed=0;

  }


  /* BRAKE */

  if(keys.brake){

    speed-=.045;

    if(speed<0)
      speed=0;

  }


  /* NITRO */

  if(keys.nitro && nitroPower>0){

    speed+=.045;

    if(speed>2.2)
      speed=2.2;

    nitroPower-=.8;

  }
  else{

    if(nitroPower<100)
      nitroPower+=.08;

  }


  /* STEERING */

  if(keys.left)
    steering-=.055;

  if(keys.right)
    steering+=.055;

  if(!keys.left && !keys.right)
    steering*=.82;


  steering=
    THREE.MathUtils.clamp(
      steering,
      -.8,
      .8
    );


  car.position.x+=
    steering*
    speed*
    .75;


  car.position.x=
    THREE.MathUtils.clamp(
      car.position.x,
      -4,
      4
    );


  car.rotation.y=
    -steering*.18;


  /* MOVE WORLD */

  const movement=
    speed;


  roadSegments.forEach(
    segment=>{

      segment.position.z+=
        movement;

      if(segment.position.z>15){

        segment.position.z-=
          roadCount*segmentLength;

      }

    }
  );


  obstacles.forEach(
    obj=>{

      obj.position.z+=movement;

      obj.rotation.y+=.01;

      if(obj.position.z>20){

        obj.position.z-=
          roadCount*segmentLength;

        const lane=
          Math.floor(
            Math.random()*3
          )-1;

        obj.position.x=
          lane*laneWidth;

      }

    }
  );


  coins.forEach(
    coin=>{

      coin.position.z+=movement;

      coin.rotation.z+=.05;

      if(coin.position.z>20){

        coin.position.z-=
          roadCount*segmentLength;

        const lane=
          Math.floor(
            Math.random()*3
          )-1;

        coin.position.x=
          lane*laneWidth;

        coin.visible=true;

      }

    }
  );


  distance+=movement;


  /* COLLISION */

  checkCollisions();


  /* LAP */

  if(distance>1000){

    distance=0;

    lap++;

    score+=500;

    if(lap>3){

      finish();

    }

  }


  /* HUD */

  document
    .getElementById("speed")
    .textContent=
      Math.floor(
        speed*120
      );

  document
    .getElementById("coins")
    .textContent=
      coinCount;

  document
    .getElementById("score")
    .textContent=
      score;

  document
    .getElementById("lap")
    .textContent=
      Math.min(lap,3);

  document
    .getElementById("nitro")
    .textContent=
      Math.floor(nitroPower);

}


/* =========================
   COLLISION
========================= */

function checkCollisions(){

  obstacles.forEach(
    obj=>{

      const dx=
        Math.abs(
          car.position.x-
          obj.position.x
        );

      const dz=
        Math.abs(
          car.position.z-
          obj.position.z
        );

      if(
        dx<1.7 &&
        dz<2.2
      ){

        speed*=.35;

        score=Math.max(
          0,
          score-50
        );

        obj.position.z-=8;

      }

    }
  );


  coins.forEach(
    coin=>{

      if(!coin.visible)
        return;

      const dx=
        Math.abs(
          car.position.x-
          coin.position.x
        );

      const dz=
        Math.abs(
          car.position.z-
          coin.position.z
        );

      if(
        dx<1.5 &&
        dz<2
      ){

        coin.visible=false;

        coinCount++;

        score+=100;

        nitroPower=
          Math.min(
            100,
            nitroPower+10
          );

      }

    }
  );

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

  const targetX=
    car.position.x*.35;

  camera.position.x+=
    (targetX-
     camera.position.x)*
     .08;

  camera.position.y+=
    (4.8-
     camera.position.y)*
     .08;

  camera.position.z+=
    (8-
     camera.position.z)*
     .08;


  camera.lookAt(
    car.position.x,
    .8,
    car.position.z-8
  );

}


/* =========================
   FINISH
========================= */

function finish(){

  running=false;

  document
    .getElementById("message")
    .classList.remove("hidden");

  document
    .getElementById("message")
    .querySelector("p")
    .textContent=
      "🏆 Balapan selesai! Score: "+
      score+
      " | Coin: "+
      coinCount;

}


/* =========================
   ANIMATE
========================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  update();

  updateCamera();

  renderer.render(
    scene,
    camera
  );

}


/* =========================
   RESIZE
========================= */

function resize(){

  camera.aspect=
    innerWidth/
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

window.addEventListener(
  "resize",
  resize
);


init();

</script>

</body>
</html>
