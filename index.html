<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Battle Arena V4.1 | Dark Fighter</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05070d;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

body{
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  background:#05070d;
}

.vignette{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:4;
  background:
    radial-gradient(circle at center,
      transparent 35%,
      rgba(0,0,0,.12) 60%,
      rgba(0,0,0,.72) 100%);
}

.scan{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
  opacity:.08;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent 3px,
    rgba(255,255,255,.06) 4px
  );
}

#hud{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:10;
  padding:14px 18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.fighterHUD{
  width:min(36vw,390px);
  min-width:220px;
}

.fighterHUD.right{
  text-align:right;
}

.name{
  font-size:clamp(13px,2vw,22px);
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 3px 10px #000;
  margin-bottom:6px;
}

.name.player{
  color:#58d8ff;
}

.name.enemy{
  color:#ff4f64;
}

.bar{
  height:18px;
  background:#10131b;
  border:2px solid rgba(255,255,255,.2);
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 15px #000;
}

.hp{
  height:100%;
  width:100%;
  transition:width .18s ease;
  background:linear-gradient(90deg,#12d6ff,#168cff);
}

.enemyHP{
  background:linear-gradient(90deg,#ff2546,#9b1029);
}

.energy{
  height:7px;
  margin-top:5px;
  background:#11151e;
  border-radius:5px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.12);
}

.energyFill{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#ffe65b,#ff9d1b);
  transition:width .2s;
}

.stats{
  margin-top:6px;
  font-size:11px;
  opacity:.75;
  letter-spacing:1px;
}

#centerHud{
  position:fixed;
  top:14px;
  left:50%;
  transform:translateX(-50%);
  z-index:12;
  text-align:center;
  pointer-events:none;
}

#round{
  font-weight:900;
  letter-spacing:3px;
  font-size:13px;
  color:#dce7ff;
  text-shadow:0 2px 8px #000;
}

#timer{
  font-size:clamp(25px,4vw,42px);
  font-weight:900;
  line-height:1;
  margin-top:3px;
  text-shadow:0 3px 15px #000;
}

#combo{
  position:fixed;
  left:50%;
  top:22%;
  transform:translate(-50%,-50%) scale(.5);
  z-index:15;
  opacity:0;
  pointer-events:none;
  text-align:center;
  transition:.18s;
}

#combo.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

.comboNumber{
  font-size:clamp(42px,8vw,92px);
  font-weight:1000;
  font-style:italic;
  line-height:.8;
  color:#fff;
  text-shadow:
    0 0 10px #19dfff,
    0 0 30px #138aff,
    5px 5px 0 #06111e;
}

.comboText{
  font-size:clamp(12px,2vw,20px);
  font-weight:900;
  letter-spacing:5px;
  color:#61eaff;
}

#comboRank{
  margin-top:4px;
  font-size:13px;
  letter-spacing:3px;
  font-weight:900;
}

#topButtons{
  position:fixed;
  right:16px;
  top:108px;
  z-index:20;
  display:flex;
  gap:8px;
}

.topBtn{
  border:1px solid rgba(255,255,255,.2);
  background:rgba(8,12,20,.78);
  color:white;
  border-radius:9px;
  padding:8px 11px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
  backdrop-filter:blur(8px);
}

.topBtn:hover{
  background:rgba(30,42,65,.9);
}

#message{
  position:fixed;
  left:50%;
  top:40%;
  transform:translate(-50%,-50%);
  z-index:30;
  font-size:clamp(18px,4vw,44px);
  font-weight:1000;
  letter-spacing:4px;
  opacity:0;
  pointer-events:none;
  text-align:center;
  text-shadow:0 5px 25px #000;
}

#message.show{
  animation:messagePop .65s ease forwards;
}

@keyframes messagePop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

#controls{
  position:fixed;
  bottom:18px;
  left:0;
  width:100%;
  z-index:25;
  display:flex;
  justify-content:space-between;
  padding:0 18px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:9px;
  align-items:end;
  pointer-events:auto;
}

.control{
  width:58px;
  height:58px;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(8,12,20,.78);
  color:#fff;
  font-size:11px;
  font-weight:900;
  box-shadow:0 6px 20px rgba(0,0,0,.5);
  backdrop-filter:blur(8px);
  user-select:none;
}

.control.big{
  width:68px;
  height:68px;
}

.control.attack{
  border-color:#2ee3ff;
  color:#71ecff;
}

.control.heavy{
  border-color:#ffae31;
  color:#ffc45f;
}

.control.skill{
  border-color:#d35cff;
  color:#e48aff;
}

.control.block{
  border-color:#79a8ff;
  color:#9bbcff;
}

.control.dash{
  border-color:#8dffbf;
  color:#a9ffcb;
}

.control:active{
  transform:scale(.9);
  background:rgba(70,90,120,.7);
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(15,35,65,.65),rgba(2,4,8,.96));
}

.panel{
  width:min(92%,520px);
  padding:34px 25px;
  border:1px solid rgba(95,205,255,.3);
  border-radius:22px;
  background:rgba(7,12,21,.9);
  box-shadow:
    0 0 80px rgba(0,150,255,.12),
    inset 0 0 40px rgba(255,255,255,.025);
  text-align:center;
  backdrop-filter:blur(15px);
}

.logo{
  font-size:clamp(30px,8vw,62px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:4px;
  background:linear-gradient(90deg,#fff,#56dcff,#9e62ff);
  -webkit-background-clip:text;
  color:transparent;
}

.subtitle{
  margin-top:7px;
  color:#9caec9;
  letter-spacing:3px;
  font-size:11px;
}

.menuStats{
  display:flex;
  justify-content:center;
  gap:30px;
  margin:24px 0;
}

.menuStat strong{
  display:block;
  font-size:24px;
}

.menuStat span{
  font-size:10px;
  opacity:.55;
  letter-spacing:2px;
}

.start{
  border:0;
  padding:15px 42px;
  border-radius:12px;
  font-weight:1000;
  letter-spacing:2px;
  color:#03101a;
  background:linear-gradient(90deg,#45e9ff,#69a7ff);
  cursor:pointer;
  box-shadow:0 0 30px rgba(55,210,255,.25);
}

.start:active{
  transform:scale(.96);
}

.help{
  margin-top:20px;
  color:#6e7e97;
  font-size:11px;
  line-height:1.8;
}

#result{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(7px);
}

.resultPanel{
  width:min(92%,470px);
  text-align:center;
  padding:35px 24px;
  border-radius:20px;
  background:rgba(8,13,23,.95);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 20px 80px #000;
}

.resultTitle{
  font-size:clamp(35px,8vw,65px);
  font-weight:1000;
  font-style:italic;
  letter-spacing:4px;
}

.resultInfo{
  margin:20px 0;
  line-height:2;
  color:#b7c3d6;
}

.hidden{
  display:none!important;
}

@media(max-width:700px){
  #hud{
    padding:10px;
  }

  .fighterHUD{
    width:38vw;
    min-width:0;
  }

  .bar{
    height:13px;
  }

  .energy{
    height:5px;
  }

  .stats{
    font-size:8px;
  }

  #centerHud{
    top:8px;
  }

  #topButtons{
    top:70px;
    right:8px;
  }

  .topBtn{
    padding:6px 8px;
    font-size:9px;
  }

  #controls{
    padding:0 8px;
    bottom:10px;
  }

  .controlGroup{
    gap:5px;
  }

  .control{
    width:46px;
    height:46px;
    font-size:8px;
  }

  .control.big{
    width:54px;
    height:54px;
  }

  .help{
    font-size:9px;
  }
}

@media(min-width:900px){
  #controls{
    display:none;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div class="vignette"></div>
<div class="scan"></div>

<div id="hud">

  <div class="fighterHUD">
    <div class="name player">⚡ SHADOW WARRIOR</div>
    <div class="bar">
      <div id="playerHP" class="hp"></div>
    </div>
    <div class="energy">
      <div id="playerEnergy" class="energyFill"></div>
    </div>
    <div class="stats">
      LV <span id="level">1</span>
      &nbsp; XP <span id="xp">0</span>
      &nbsp; COINS <span id="coins">0</span>
    </div>
  </div>

  <div class="fighterHUD right">
    <div class="name enemy">DEMON OVERLORD ⚠</div>
    <div class="bar">
      <div id="enemyHP" class="hp enemyHP"></div>
    </div>
    <div class="energy">
      <div id="enemyEnergy" class="energyFill"></div>
    </div>
    <div class="stats">
      BOSS LEVEL <span id="enemyLevel">1</span>
    </div>
  </div>

</div>

<div id="centerHud">
  <div id="round">BATTLE ARENA</div>
  <div id="timer">99</div>
</div>

<div id="combo">
  <div class="comboNumber" id="comboNumber">0</div>
  <div class="comboText">COMBO</div>
  <div id="comboRank">READY</div>
</div>

<div id="topButtons">
  <button class="topBtn" id="pauseBtn">Ⅱ PAUSE</button>
  <button class="topBtn" id="soundBtn">🔊 SOUND</button>
</div>

<div id="message"></div>

<div id="controls">

  <div class="controlGroup">
    <button class="control" id="leftBtn">◀</button>
    <button class="control" id="rightBtn">▶</button>
    <button class="control dash" id="dashBtn">DASH</button>
    <button class="control block" id="blockBtn">BLOCK</button>
  </div>

  <div class="controlGroup">
    <button class="control attack" id="attackBtn">ATK</button>
    <button class="control heavy" id="heavyBtn">HEAVY</button>
    <button class="control skill big" id="skillBtn">SKILL</button>
  </div>

</div>

<div id="menu">
  <div class="panel">
    <div class="logo">BATTLE ARENA</div>
    <div class="subtitle">V4.1 • DARK FIGHTER ENGINE</div>

    <div class="menuStats">
      <div class="menuStat">
        <strong id="menuLevel">1</strong>
        <span>LEVEL</span>
      </div>
      <div class="menuStat">
        <strong id="menuXP">0</strong>
        <span>XP</span>
      </div>
      <div class="menuStat">
        <strong id="menuCoins">0</strong>
        <span>COINS</span>
      </div>
    </div>

    <button class="start" id="startBtn">ENTER THE ARENA</button>

    <div class="help">
      PC: A / D = MOVE • J = ATTACK • K = HEAVY<br>
      L = SKILL • SPACE = BLOCK • SHIFT = DASH
    </div>
  </div>
</div>

<div id="result">
  <div class="resultPanel">
    <div class="resultTitle" id="resultTitle">VICTORY</div>

    <div class="resultInfo">
      XP +<span id="rewardXP">0</span><br>
      COINS +<span id="rewardCoins">0</span><br>
      COMBO <span id="finalCombo">0</span>
    </div>

    <button class="start" id="againBtn">FIGHT AGAIN</button>
  </div>
</div>

<script>
"use strict";

/* =========================================================
   BATTLE ARENA V4.1
   SINGLE FILE REAL-TIME CANVAS ENGINE
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;
let dpr = Math.min(devicePixelRatio || 1,2);

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W*dpr;
  canvas.height = H*dpr;
  canvas.style.width = W+"px";
  canvas.style.height = H+"px";

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();

/* =========================
   SAVE DATA
========================= */

let save = JSON.parse(
  localStorage.getItem("battleArenaSaveV41") ||
  '{"level":1,"xp":0,"coins":0,"bestCombo":0}'
);

let level = save.level || 1;
let xp = save.xp || 0;
let coins = save.coins || 0;
let bestCombo = save.bestCombo || 0;

function saveGame(){
  localStorage.setItem(
    "battleArenaSaveV41",
    JSON.stringify({
      level,
      xp,
      coins,
      bestCombo
    })
  );
}

function updateSaveUI(){
  document.getElementById("level").textContent = level;
  document.getElementById("xp").textContent = xp;
  document.getElementById("coins").textContent = coins;

  document.getElementById("menuLevel").textContent = level;
  document.getElementById("menuXP").textContent = xp;
  document.getElementById("menuCoins").textContent = coins;
}

updateSaveUI();

/* =========================
   GAME STATE
========================= */

let running = false;
let paused = false;
let gameOver = false;

let timer = 99;
let timerAccumulator = 0;

let shake = 0;
let flash = 0;

let combo = 0;
let comboTimer = 0;

let soundOn = true;

let particles = [];
let floatingTexts = [];
let slashEffects = [];
let sparks = [];

/* =========================
   INPUT
========================= */

const keys = {};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()] = true;

  if(
    [" ","arrowleft","arrowright","shift"].includes(e.key.toLowerCase())
  ){
    e.preventDefault();
  }

  if(e.key.toLowerCase()==="p"){
    togglePause();
  }

  if(e.key.toLowerCase()==="j") attack();
  if(e.key.toLowerCase()==="k") heavyAttack();
  if(e.key.toLowerCase()==="l") skill();
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;
});

/* =========================
   PLAYER
========================= */

const player = {
  x:0,
  y:0,
  vx:0,
  vy:0,

  width:54,
  height:115,

  hp:100,
  maxHp:100,

  energy:100,
  maxEnergy:100,

  facing:1,

  blocking:false,
  attacking:false,
  attackTimer:0,

  hitFlash:0,

  dashCooldown:0,
  attackCooldown:0,

  color:0
};

/* =========================
   ENEMY
========================= */

const enemy = {
  x:0,
  y:0,
  vx:0,

  width:62,
  height:125,

  hp:100,
  maxHp:100,

  energy:100,
  maxEnergy:100,

  facing:-1,

  attacking:false,
  attackTimer:0,

  hitFlash:0,

  aiTimer:0,
  attackCooldown:0,

  phase:1
};

function resetBattle(){

  player.x = W*.27;
  player.y = H*.70;
  player.vx = 0;
  player.hp = player.maxHp;
  player.energy = player.maxEnergy;
  player.blocking = false;
  player.attacking = false;
  player.attackTimer = 0;
  player.dashCooldown = 0;
  player.attackCooldown = 0;

  enemy.x = W*.73;
  enemy.y = H*.70;
  enemy.vx = 0;
  enemy.hp = enemy.maxHp;
  enemy.energy = enemy.maxEnergy;
  enemy.attacking = false;
  enemy.attackTimer = 0;
  enemy.attackCooldown = 0;

  timer = 99;
  timerAccumulator = 0;

  combo = 0;
  comboTimer = 0;

  particles.length = 0;
  floatingTexts.length = 0;
  slashEffects.length = 0;
  sparks.length = 0;

  gameOver = false;
  paused = false;

  updateHUD();
}

/* =========================
   HELPERS
========================= */

function clamp(v,min,max){
  return Math.max(min,Math.min(max,v));
}

function dist(a,b){
  return Math.abs(a-b);
}

function groundY(){
  return H*.73;
}

function rand(min,max){
  return Math.random()*(max-min)+min;
}

/* =========================
   PARTICLES
========================= */

function particle(x,y,color,count=12,power=4){

  for(let i=0;i<count;i++){

    particles.push({
      x,
      y,
      vx:rand(-power,power),
      vy:rand(-power*1.4,power*.3),
      life:rand(.35,.9),
      max:.9,
      size:rand(2,6),
      color
    });

  }
}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x += p.vx;
    p.y += p.vy;

    p.vy += .12;
    p.vx *= .98;

    p.life -= dt;

    if(p.life<=0){
      particles.splice(i,1);
    }
  }
}

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha = Math.max(0,p.life/p.max);

    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fillStyle=p.color;
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =========================
   FLOATING DAMAGE
========================= */

function damageText(x,y,text,color){

  floatingTexts.push({
    x,
    y,
    text,
    color,
    life:1
  });
}

function updateFloating(dt){

  for(let i=floatingTexts.length-1;i>=0;i--){

    const t=floatingTexts[i];

    t.y -= 35*dt;
    t.life -= dt;

    if(t.life<=0){
      floatingTexts.splice(i,1);
    }
  }
}

function drawFloating(){

  ctx.textAlign="center";
  ctx.font="900 22px Arial";

  for(const t of floatingTexts){

    ctx.globalAlpha=t.life;
    ctx.fillStyle=t.color;

    ctx.strokeStyle="#000";
    ctx.lineWidth=5;

    ctx.strokeText(t.text,t.x,t.y);
    ctx.fillText(t.text,t.x,t.y);
  }

  ctx.globalAlpha=1;
}

/* =========================
   SLASH EFFECT
========================= */

function slash(x,y,dir,color,strong=false){

  slashEffects.push({
    x,
    y,
    dir,
    color,
    life:.25,
    strong
  });
}

function updateSlashes(dt){

  for(let i=slashEffects.length-1;i>=0;i--){

    slashEffects[i].life-=dt;

    if(slashEffects[i].life<=0){
      slashEffects.splice(i,1);
    }
  }
}

function drawSlashes(){

  for(const s of slashEffects){

    const alpha=s.life/.25;

    ctx.save();

    ctx.translate(s.x,s.y);
    ctx.scale(s.dir,1);

    ctx.globalAlpha=alpha;

    ctx.strokeStyle=s.color;
    ctx.lineWidth=s.strong?10:6;
    ctx.lineCap="round";

    ctx.beginPath();
    ctx.arc(
      0,
      0,
      s.strong?65:48,
      -1.1,
      .65
    );
    ctx.stroke();

    ctx.globalAlpha=alpha*.35;
    ctx.lineWidth=s.strong?20:12;
    ctx.stroke();

    ctx.restore();
  }

  ctx.globalAlpha=1;
}

/* =========================
   SPARKS
========================= */

function spark(x,y,color){

  for(let i=0;i<18;i++){

    sparks.push({
      x,
      y,
      vx:rand(-8,8),
      vy:rand(-8,5),
      life:rand(.15,.5),
      color
    });
  }
}

function updateSparks(dt){

  for(let i=sparks.length-1;i>=0;i--){

    const s=sparks[i];

    s.x+=s.vx;
    s.y+=s.vy;

    s.vy+=.35;

    s.life-=dt;

    if(s.life<=0){
      sparks.splice(i,1);
    }
  }
}

function drawSparks(){

  for(const s of sparks){

    ctx.globalAlpha=s.life/.5;

    ctx.fillStyle=s.color;

    ctx.beginPath();
    ctx.arc(s.x,s.y,rand(1,3),0,Math.PI*2);
    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* =========================
   ARENA
========================= */

function drawArena(){

  const g=ctx.createLinearGradient(0,0,0,H);

  g.addColorStop(0,"#02040b");
  g.addColorStop(.45,"#071120");
  g.addColorStop(1,"#020308");

  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  /* moon */

  ctx.save();

  ctx.globalAlpha=.8;

  const moonX=W*.5;
  const moonY=H*.19;
  const moonR=Math.min(W,H)*.09;

  const mg=ctx.createRadialGradient(
    moonX,moonY,moonR*.1,
    moonX,moonY,moonR
  );

  mg.addColorStop(0,"rgba(220,245,255,.9)");
  mg.addColorStop(.5,"rgba(80,160,220,.18)");
  mg.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=mg;
  ctx.beginPath();
  ctx.arc(moonX,moonY,moonR,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

  /* distant ruins */

  drawRuins();

  /* fog */

  const fog=ctx.createLinearGradient(0,H*.45,0,H*.8);
  fog.addColorStop(0,"rgba(60,130,190,0)");
  fog.addColorStop(.55,"rgba(50,120,160,.08)");
  fog.addColorStop(1,"rgba(0,0,0,.3)");

  ctx.fillStyle=fog;
  ctx.fillRect(0,H*.4,W,H*.5);

  /* floor */

  drawFloor();

  /* torches */

  drawTorch(W*.12,H*.53);
  drawTorch(W*.88,H*.53);
}

function drawRuins(){

  ctx.fillStyle="#080d17";

  for(let i=0;i<13;i++){

    const x=i*W/12;
    const h=rand(60,170);

    ctx.fillRect(
      x,
      H*.52-h,
      rand(25,55),
      h
    );
  }

  /* columns */

  ctx.fillStyle="#0d1523";

  for(let side of [0,1]){

    const x=side?W*.82:W*.18;

    for(let i=0;i<3;i++){

      ctx.fillRect(
        x+i*42,
        H*.42,
        27,
        H*.31
      );

      ctx.fillRect(
        x+i*42-6,
        H*.41,
        39,
        9
      );
    }
  }
}

function drawFloor(){

  const gy=groundY();

  ctx.fillStyle="#070b12";

  ctx.beginPath();
  ctx.moveTo(0,gy);
  ctx.lineTo(W,gy);
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.closePath();
  ctx.fill();

  /* perspective lines */

  ctx.strokeStyle="rgba(60,140,190,.12)";
  ctx.lineWidth=1;

  for(let i=-10;i<=10;i++){

    ctx.beginPath();
    ctx.moveTo(W/2,gy);
    ctx.lineTo(
      W/2+i*100,
      H
    );
    ctx.stroke();
  }

  for(let i=1;i<7;i++){

    const y=gy + Math.pow(i/6,1.7)*(H-gy);

    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(W,y);
    ctx.stroke();
  }

  /* central arena circle */

  ctx.strokeStyle="rgba(45,190,255,.16)";
  ctx.lineWidth=2;

  ctx.beginPath();
  ctx.ellipse(
    W/2,
    gy+20,
    W*.27,
    55,
    0,0,Math.PI*2
  );
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(
    W/2,
    gy+20,
    W*.17,
    32,
    0,0,Math.PI*2
  );
  ctx.stroke();
}

function drawTorch(x,y){

  ctx.fillStyle="#161b25";
  ctx.fillRect(x-4,y,8,H*.2);

  const rg=ctx.createRadialGradient(x,y,2,x,y,65);

  rg.addColorStop(0,"rgba(255,220,100,.35)");
  rg.addColorStop(1,"rgba(255,90,20,0)");

  ctx.fillStyle=rg;
  ctx.beginPath();
  ctx.arc(x,y,65,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#ffb52c";

  ctx.beginPath();
  ctx.moveTo(x,y-5);
  ctx.quadraticCurveTo(x-13,y-24,x,y-38);
  ctx.quadraticCurveTo(x+13,y-24,x,y-5);
  ctx.fill();

  ctx.fillStyle="#fff3a0";

  ctx.beginPath();
  ctx.arc(x,y-18,5,0,Math.PI*2);
  ctx.fill();
}

function drawFighter(
  x,y,dir,primary,dark,boss,hitFlash
){

  ctx.save();

  ctx.translate(x,y);

  /* shadow */

  ctx.globalAlpha=.45;

  ctx.fillStyle="#000";

  ctx.beginPath();
  ctx.ellipse(
    0,
    8,
    boss?55:48,
    13,
    0,0,Math.PI*2
  );
  ctx.fill();

  ctx.globalAlpha=1;

  /* aura */

  if(boss){

    const aura=ctx.createRadialGradient(
      0,-65,5,
      0,-65,95
    );

    aura.addColorStop(0,"rgba(255,30,60,.25)");
    aura.addColorStop(1,"rgba(255,0,30,0)");

    ctx.fillStyle=aura;

    ctx.beginPath();
    ctx.arc(0,-65,95,0,Math.PI*2);
    ctx.fill();
  }

  /* legs */

  ctx.strokeStyle="#111827";
  ctx.lineWidth=boss?15:13;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-13,0);
  ctx.lineTo(-22,48);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(13,0);
  ctx.lineTo(22,48);
  ctx.stroke();

  /* boots */

  ctx.strokeStyle=dark;
  ctx.lineWidth=boss?17:15;

  ctx.beginPath();
  ctx.moveTo(-22,46);
  ctx.lineTo(-34,49);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(22,46);
  ctx.lineTo(34,49);
  ctx.stroke();

  /* body armor */

  const bodyGrad=ctx.createLinearGradient(
    -25,-90,
    25,-15
  );

  bodyGrad.addColorStop(0,primary);
  bodyGrad.addColorStop(.5,dark);
  bodyGrad.addColorStop(1,"#070b12");

  ctx.fillStyle=bodyGrad;

  ctx.beginPath();

  ctx.moveTo(-25,-80);
  ctx.lineTo(25,-80);
  ctx.lineTo(30,-20);
  ctx.lineTo(0,0);
  ctx.lineTo(-30,-20);
  ctx.closePath();

  ctx.fill();

  /* chest plate */

  ctx.strokeStyle=primary;
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-17,-66);
  ctx.lineTo(0,-50);
  ctx.lineTo(17,-66);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0,-78);
  ctx.lineTo(0,-27);
  ctx.stroke();

  /* shoulder */

  ctx.fillStyle=dark;

  ctx.beginPath();
  ctx.arc(-28,-68,13,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(28,-68,13,0,Math.PI*2);
  ctx.fill();

  /* arms */

  ctx.strokeStyle=dark;
  ctx.lineWidth=boss?17:14;

  ctx.beginPath();
  ctx.moveTo(-25,-65);
  ctx.lineTo(-45,-35);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(25,-65);
  ctx.lineTo(45,-35);
  ctx.stroke();

  /* fists */

  ctx.fillStyle=primary;

  ctx.beginPath();
  ctx.arc(-46,-32,9,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(46,-32,9,0,Math.PI*2);
  ctx.fill();

  /* neck */

  ctx.fillStyle="#111923";

  ctx.fillRect(-8,-94,16,15);

  /* head */

  ctx.fillStyle="#101923";

  ctx.beginPath();
  ctx.arc(0,-110,boss?27:24,0,Math.PI*2);
  ctx.fill();

  /* mask */

  ctx.fillStyle=dark;

  ctx.beginPath();
  ctx.moveTo(-24,-115);
  ctx.lineTo(0,-128);
  ctx.lineTo(24,-115);
  ctx.lineTo(17,-98);
  ctx.lineTo(-17,-98);
  ctx.closePath();
  ctx.fill();

  /* eyes */

  ctx.fillStyle=primary;
  ctx.shadowColor=primary;
  ctx.shadowBlur=12;

  ctx.fillRect(-15,-115,9,4);
  ctx.fillRect(6,-115,9,4);

  ctx.shadowBlur=0;

  /* horns */

  if(boss){

    ctx.fillStyle=primary;

    ctx.beginPath();
    ctx.moveTo(-19,-129);
    ctx.lineTo(-34,-154);
    ctx.lineTo(-9,-136);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(19,-129);
    ctx.lineTo(34,-154);
    ctx.lineTo(9,-136);
    ctx.closePath();
    ctx.fill();
  }

  /* hit flash */

  if(hitFlash>0){

    ctx.globalAlpha=hitFlash;

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.arc(0,-65,65,0,Math.PI*2);
    ctx.fill();

    ctx.globalAlpha=1;
  }

  ctx.restore();
}

/* =========================
   PLAYER MOVEMENT
========================= */

function updatePlayer(dt){

  if(!running || paused || gameOver) return;

  player.blocking = !!keys[" "];

  if(player.blocking){
    player.vx*=.75;
  }else{

    if(keys["a"] || keys["arrowleft"]){
      player.vx=-4.5;
      player.facing=-1;
    }

    if(keys["d"] || keys["arrowright"]){
      player.vx=4.5;
      player.facing=1;
    }

    if(
      !(keys["a"]||keys["arrowleft"]||
        keys["d"]||keys["arrowright"])
    ){
      player.vx*=.78;
    }
  }

  player.x+=player.vx;

  player.x=clamp(
    player.x,
    70,
    W-70
  );

  if(player.attackCooldown>0)
    player.attackCooldown-=dt;

  if(player.dashCooldown>0)
    player.dashCooldown-=dt;

  if(player.hitFlash>0)
    player.hitFlash-=dt;

  if(player.energy<player.maxEnergy){
    player.energy=clamp(
      player.energy+11*dt,
      0,
      player.maxEnergy
    );
  }
}

/* =========================
   ENEMY AI
========================= */

function updateEnemy(dt){

  if(!running || paused || gameOver) return;

  const d=player.x-enemy.x;
  const abs=Math.abs(d);

  enemy.facing=d>=0?1:-1;

  if(enemy.attackCooldown>0)
    enemy.attackCooldown-=dt;

  if(enemy.hitFlash>0)
    enemy.hitFlash-=dt;

  if(enemy.energy<enemy.maxEnergy){
    enemy.energy=clamp(
      enemy.energy+8*dt,
      0,
      enemy.maxEnergy
    );
  }

  if(abs>150){

    enemy.vx += Math.sign(d)*.18;
    enemy.vx=clamp(enemy.vx,-2.8,2.8);

  }else{

    enemy.vx*=.8;

    enemy.aiTimer-=dt;

    if(enemy.aiTimer<=0){

      enemy.aiTimer=rand(.35,1.1);

      const r=Math.random();

      if(r<.55){

        enemyAttack();

      }else if(r<.78 && enemy.energy>=30){

        enemyHeavy();

      }else if(enemy.energy>=55){

        enemySkill();

      }
    }
  }

  enemy.x+=enemy.vx;

  enemy.x=clamp(
    enemy.x,
    70,
    W-70
  );
}

/* =========================
   COMBAT
========================= */

function inRange(range=135){

  return Math.abs(
    player.x-enemy.x
  )<range;
}

function attack(){

  if(!running || paused || gameOver) return;

  if(player.attackCooldown>0) return;

  player.attackCooldown=.28;
  player.attacking=true;

  setTimeout(()=>{
    player.attacking=false;
  },170);

  slash(
    player.x+player.facing*38,
    player.y-72,
    player.facing,
    "#59eaff",
    false
  );

  if(inRange(145)){

    let damage=8+level*1.2;

    if(enemy.hp<=0) return;

    enemy.hp=clamp(
      enemy.hp-damage,
      0,
      enemy.maxHp
    );

    combo++;
    comboTimer=1.15;

    enemy.hitFlash=.18;

    shake=5;

    spark(
      enemy.x,
      enemy.y-65,
      "#58eaff"
    );

    damageText(
      enemy.x,
      enemy.y-150,
      "-"+Math.round(damage),
      "#6beaff"
    );

    soundHit();

    updateCombo();
  }
}

function heavyAttack(){

  if(!running || paused || gameOver) return;

  if(player.attackCooldown>0) return;

  player.attackCooldown=.7;
  player.attacking=true;

  setTimeout(()=>{
    player.attacking=false;
  },320);

  slash(
    player.x+player.facing*50,
    player.y-70,
    player.facing,
    "#ffb13b",
    true
  );

  if(inRange(170)){

    let damage=18+level*2;

    enemy.hp=clamp(
      enemy.hp-damage,
      0,
      enemy.maxHp
    );

    combo++;
    comboTimer=1.25;

    enemy.hitFlash=.3;

    shake=10;

    spark(
      enemy.x,
      enemy.y-70,
      "#ffd25a"
    );

    damageText(
      enemy.x,
      enemy.y-155,
      "-"+Math.round(damage),
      "#ffc45b"
    );

    soundHeavy();

    updateCombo();
  }
}

function skill(){

  if(!running || paused || gameOver) return;

  if(player.energy<40){
    showMessage("ENERGY LOW");
    return;
  }

  player.energy-=40;

  slash(
    player.x+player.facing*55,
    player.y-70,
    player.facing,
    "#d65cff",
    true
  );

  particle(
    player.x+player.facing*50,
    player.y-70,
    "#d85cff",
    30,
    7
  );

  if(inRange(220)){

    const damage=30+level*3;

    enemy.hp=clamp(
      enemy.hp-damage,
      0,
      enemy.maxHp
    );

    combo+=2;
    comboTimer=1.5;

    enemy.hitFlash=.4;

    shake=18;
    flash=.12;

    damageText(
      enemy.x,
      enemy.y-170,
      "-"+Math.round(damage),
      "#ec8cff"
    );

    spark(
      enemy.x,
      enemy.y-70,
      "#ef7aff"
    );

    soundSkill();

    updateCombo();
  }
}

function enemyAttack(){

  if(enemy.attackCooldown>0) return;

  enemy.attackCooldown=.75;

  if(
    Math.abs(player.x-enemy.x)<145
  ){

    let damage=9+level*1.5;

    if(player.blocking){

      damage*=.22;

      spark(
        player.x,
        player.y-70,
        "#70a8ff"
      );

      damageText(
        player.x,
        player.y-145,
        "BLOCK",
        "#72aaff"
      );

    }else{

      shake=5;

      player.hitFlash=.2;

      spark(
        player.x,
        player.y-70,
        "#ff4e62"
      );

      damageText(
        player.x,
        player.y-145,
        "-"+Math.round(damage),
        "#ff6172"
      );
    }

    player.hp=clamp(
      player.hp-damage,
      0,
      player.maxHp
    );

    soundHit();
  }
}

function enemyHeavy(){

  if(enemy.attackCooldown>0) return;

  enemy.attackCooldown=1.15;

  if(Math.abs(player.x-enemy.x)<175){

    let damage=18+level*2;

    if(player.blocking){

      damage*=.25;

      spark(
        player.x,
        player.y-70,
        "#72aaff"
      );

    }else{

      shake=11;

      player.hitFlash=.3;

      damageText(
        player.x,
        player.y-155,
        "-"+Math.round(damage),
        "#ff9d4a"
      );
    }

    player.hp=clamp(
      player.hp-damage,
      0,
      player.maxHp
    );

    soundHeavy();
  }
}

function enemySkill(){

  if(enemy.attackCooldown>0) return;

  if(enemy.energy<45){
    enemyAttack();
    return;
  }

  enemy.energy-=45;
  enemy.attackCooldown=1.5;

  if(Math.abs(player.x-enemy.x)<220){

    let damage=28+level*2.5;

    if(player.blocking)
      damage*=.25;

    player.hp=clamp(
      player.hp-damage,
      0,
      player.maxHp
    );

    shake=16;
    flash=.1;

    particle(
      player.x,
      player.y-70,
      "#ff3155",
      30,
      7
    );

    damageText(
      player.x,
      player.y-170,
      "-"+Math.round(damage),
      "#ff5270"
    );

    soundSkill();
  }
}

/* =========================
   COMBO
========================= */

function updateCombo(){

  const el=document.getElementById("combo");
  const num=document.getElementById("comboNumber");
  const rank=document.getElementById("comboRank");

  num.textContent=combo;

  if(combo<3){
    rank.textContent="GOOD";
    rank.style.color="#69dfff";
  }else if(combo<6){
    rank.textContent="GREAT";
    rank.style.color="#ffe36a";
  }else if(combo<10){
    rank.textContent="EPIC";
    rank.style.color="#ff9c55";
  }else{
    rank.textContent="LEGEND";
    rank.style.color="#e878ff";
  }

  el.classList.remove("show");

  void el.offsetWidth;

  el.classList.add("show");

  if(combo>bestCombo){
    bestCombo=combo;
  }
}

   HUD
========================= */

function updateHUD(){

  document.getElementById("playerHP").style.width =
    (player.hp/player.maxHp*100)+"%";

  document.getElementById("enemyHP").style.width =

/* =========================
   GAME END
========================= */

function victory(){

  if(gameOver) return;

  gameOver=true;

  const rewardXP=60+level*15;
  const rewardCoins=35+level*10;

  xp+=rewardXP;
  coins+=rewardCoins;

  while(xp>=100){

    xp-=100;
    level++;

    showMessage("LEVEL UP!");

  }

  saveGame();
  updateSaveUI();

  document.getElementById("rewardXP").textContent=rewardXP;
  document.getElementById("rewardCoins").textContent=rewardCoins;
  document.getElementById("finalCombo").textContent=combo;

  document.getElementById("resultTitle").textContent="VICTORY";
  document.getElementById("resultTitle").style.color="#65e8ff";

  document.getElementById("result").style.display="flex";

  particle(
    player.x,
    player.y-70,
    "#5ceaff",
    80,
    10
  );
}

function defeat(){

  if(gameOver) return;

  gameOver=true;

  document.getElementById("rewardXP").textContent="0";
  document.getElementById("rewardCoins").textContent="0";
  document.getElementById("finalCombo").textContent=combo;

  document.getElementById("resultTitle").textContent="DEFEAT";
  document.getElementById("resultTitle").style.color="#ff4d62";

  document.getElementById("result").style.display="flex";
}

/* =========================
   TIMER
========================= */

function updateTimer(dt){

  if(!running || paused || gameOver) return;

  timerAccumulator+=dt;

  if(timerAccumulator>=1){

    timerAccumulator=0;
    timer--;

    if(timer<=0){

      if(player.hp>=enemy.hp){
        victory();
      }else{
        defeat();
      }
    }
  }
}

/* =========================
   SOUND
========================= */

let audioCtx=null;

function audio(){

  if(!soundOn) return;

  if(!audioCtx){

    audioCtx=
      new (window.AudioContext||
      window.webkitAudioContext)();
  }
}

function tone(freq,duration,type="sine",volume=.04){

  if(!soundOn) return;

  audio();

  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();

  o.type=type;
  o.frequency.value=freq;

  g.gain.value=volume;

  o.connect(g);
  g.connect(audioCtx.destination);

  o.start();

  g.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime+duration
  );

  o.stop(audioCtx.currentTime+duration);
}

function soundHit(){
  tone(130,.07,"square",.035);
}

function soundHeavy(){
  tone(80,.15,"sawtooth",.05);
}

function soundSkill(){
  tone(260,.2,"triangle",.055);
  setTimeout(()=>{
    tone(520,.15,"sine",.04);
  },50);
}

/* =========================
   MAIN UPDATE
========================= */

let last=performance.now();

function update(now){

  const dt=Math.min(
    (now-last)/1000,
    .033
  );

  last=now;

  if(running && !paused && !gameOver){

    updatePlayer(dt);
    updateEnemy(dt);

    if(comboTimer>0){

      comboTimer-=dt;

      if(comboTimer<=0){
        combo=0;
      }
    }

    updateTimer(dt);
  }

  updateParticles(dt);
  updateFloating(dt);
  updateSlashes(dt);
  updateSparks(dt);

  if(shake>0)
    shake*=.88;

  if(flash>0)
    flash-=dt;

  updateHUD();

  draw();

  requestAnimationFrame(update);
}

/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(0,0,W,H);

  ctx.save();

  if(shake>0){

    ctx.translate(
      rand(-shake,shake),
      rand(-shake,shake)
    );
  }

  drawArena();

  drawPlayer();
  drawEnemy();

  drawSlashes();
  drawParticles();
  drawSparks();
  drawFloating();

  ctx.restore();

  if(flash>0){

    ctx.fillStyle=
      `rgba(255,255,255,${flash})`;

    ctx.fillRect(0,0,W,H);
  }
}

  document.getElementById("menu").style.display="none";
  document.getElementById("result").style.display="none";

  resetBattle();

  running=true;

  showMessage("FIGHT!");

}

document.getElementById("soundBtn")
.addEventListener("click",()=>{

  soundOn=!soundOn;

  document.getElementById("soundBtn").textContent =
    soundOn ? "🔊 SOUND" : "🔇 MUTED";
});

/* mobile controls */

function holdButton(id,key){

  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  b.addEventListener("pointerup",e=>{
    e.preventDefault();
    keys[key]=false;
  });

  b.addEventListener("pointercancel",()=>{
    keys[key]=false;
  });

  b.addEventListener("pointerleave",()=>{
    keys[key]=false;
  });
}

holdButton("leftBtn","arrowleft");
holdButton("rightBtn","arrowright");
holdButton("blockBtn"," ");

document.getElementById("dashBtn")
.addEventListener("pointerdown",e=>{
  e.preventDefault();

  if(
    running &&
    !paused &&
    !gameOver &&
    player.dashCooldown<=0
  ){

    player.dashCooldown=1;

    player.x+=player.facing*105;

    player.x=clamp(
      player.x,
      70,
      W-70
    );

    particle(
      player.x-player.facing*50,
      player.y-40,
      "#8dffbf",
      18,
      5
    );

    shake=3;
  }
});

document.getElementById("attackBtn")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  attack();
});

document.getElementById("heavyBtn")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  heavyAttack();
});

document.getElementById("skillBtn")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  skill();
});

/* =========================

resetBattle();

requestAnimationFrame(update);

</script>
